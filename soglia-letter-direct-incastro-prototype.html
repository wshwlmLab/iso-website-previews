<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Il Suono Organizzato — Soglia — prototipo isolato: incastro diretto lettera-per-lettera (L/M/N)</title>
<style>
@font-face{
  font-family:"New Heterodox Mono";
  src:url("https://cdn.jsdelivr.net/gh/hckiang/font-new-heterodox-mono@main/NewHeterodoxMono-Book.otf") format("opentype");
  font-weight:400;font-style:normal;font-display:swap;
}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"New Heterodox Mono","Courier New",monospace}
#stage{
  position:absolute;inset:0;background:#fff;color:#090909;overflow:hidden;
}
.glyph{
  position:absolute;left:0;top:0;
  font-size:clamp(20px,3.4vw,40px);font-weight:500;line-height:1;
  letter-spacing:.01em;white-space:pre;pointer-events:none;
  will-change:transform,opacity;transform:translate(-50%,-50%);
  transition:none;
}
#hud{
  position:absolute;left:0;right:0;bottom:3vh;text-align:center;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;
  opacity:.55;pointer-events:none;
}
#hud b{opacity:1}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">DA VERIFICARE — prototipo isolato, non integrato in Soglia — incastro diretto, fase corrente: <b id="hudPhase">L</b></div>

<script>
(() => {
// ---------- DA VERIFICARE ----------
// Unico problema affrontato qui: eliminare l'attraversamento visivo tra parole
// diverse durante il cambio frase L/M/N. Contenuto parole/punteggiatura e layout
// finale (riga per riga, blocco centrato) sono identici a quelli già usati nella
// candidate v47 integrata (stessa funzione computeSentenceCenters). L'UNICA cosa
// che cambia è la traiettoria: ogni lettera va in linea retta, senza tappe
// intermedie, dal proprio punto di dispersione al proprio punto esatto finale.
// Timing/easing sono una prima proposta, non confermati.
const stage=document.getElementById('stage');
const hudPhase=document.getElementById('hudPhase');

const SENTENCE_VARIANTS={
  L:{
    rows:[['FORME','CHE','NASCONO','NEL','SUONO'],['CREANO','RELAZIONI'],['IMMAGINI','SPAZI','STORIE']],
    punctAfter:{RELAZIONI:',',IMMAGINI:',',SPAZI:',',STORIE:'.'}
  },
  M:{
    rows:[['RELAZIONI','IMMAGINI','SPAZI','STORIE'],['NASCONO','NEL','SUONO'],['CREANO','FORME']],
    punctAfter:{RELAZIONI:',',IMMAGINI:',',SPAZI:',',STORIE:':',SUONO:',',FORME:'.'}
  },
  N:{
    rows:[['SUONO'],['RELAZIONI','IMMAGINI','SPAZI','STORIE'],['CHE','NASCONO','CHE','CREANO','FORME']],
    punctAfter:{SUONO:'.',RELAZIONI:',',IMMAGINI:',',SPAZI:',',STORIE:'.',NASCONO:',',FORME:'.'}
  }
};
const ORDER=['L','M','N'];
const DWELL_MS=3000;
const EXIT_MS=480;
const ENTER_MS=900;
const ENTER_STAGGER_MAX=260;

function fontSizePx(){return Math.max(22,Math.min(stage.clientWidth*.0242,37.4));}
function charWidthNorm(){return (fontSizePx()*.62)/stage.clientWidth;}
function spaceNorm(){return charWidthNorm();}
function wordWidthNorm(text){return charWidthNorm()*text.length;}

// Identical row-flow layout logic to the integrated v47 candidate: words are
// placed left-to-right per row with cumulative cursor (no overlap by
// construction), rows stacked, whole block re-centered. This part is not new;
// only the letter-motion below is.
function computeLayout(variantId){
  const variant=SENTENCE_VARIANTS[variantId];
  const rows=variant.rows;
  const punctAfter=variant.punctAfter;
  const gap=spaceNorm();
  const cw=charWidthNorm();
  const rowYTarget=[.415,.495,.575];
  const wordCenters={};
  const punctItems=[]; // {afterKey, text, x, y}

  const seen={};
  const rowsKeyed=rows.map(row=>row.map(text=>{
    seen[text]=(seen[text]||0)+1;
    return {text,key:text+'#'+seen[text]};
  }));

  rowsKeyed.forEach((row,rowIndex)=>{
    let rowWidth=0;
    row.forEach((w,idx)=>{
      rowWidth+=wordWidthNorm(w.text);
      if(punctAfter[w.text]) rowWidth+=cw;
      if(idx<row.length-1) rowWidth+=gap;
    });
    let cursor=.5-rowWidth/2;
    const y=rowYTarget[rowIndex];
    row.forEach((w,idx)=>{
      const wWidth=wordWidthNorm(w.text);
      wordCenters[w.key]={text:w.text,x:cursor+wWidth/2,y};
      cursor+=wWidth;
      if(punctAfter[w.text]){
        punctItems.push({text:punctAfter[w.text],x:cursor+cw/2,y});
        cursor+=cw;
      }
      if(idx<row.length-1) cursor+=gap;
    });
  });

  // Re-center the whole block on its true bounding box (same approach as v47).
  let minX=Infinity,maxX=-Infinity;
  Object.values(wordCenters).forEach(w=>{
    const hw=wordWidthNorm(w.text)/2;
    minX=Math.min(minX,w.x-hw);maxX=Math.max(maxX,w.x+hw);
  });
  punctItems.forEach(p=>{minX=Math.min(minX,p.x-cw/2);maxX=Math.max(maxX,p.x+cw/2)});
  const shift=.5-(minX+maxX)/2;
  Object.values(wordCenters).forEach(w=>{w.x+=shift});
  punctItems.forEach(p=>{p.x+=shift});

  // Flatten to individual letter targets.
  const letters=[];
  Object.values(wordCenters).forEach(w=>{
    const total=cw*w.text.length;
    let x=w.x-total/2+cw/2;
    [...w.text].forEach(ch=>{letters.push({ch,x,y:w.y});x+=cw});
  });
  punctItems.forEach(p=>letters.push({ch:p.text,x:p.x,y:p.y}));

  return letters;
}

function randomScatterPoint(taken){
  // Full-field scatter, kept a small margin from the hard edges. When `taken`
  // is given (a batch of points already placed for this same entrance), reject
  // and retry points that land too close to an existing one, so two unrelated
  // letters never start on top of each other even for a single frame.
  const minDist=.045;
  for(let attempt=0;attempt<40;attempt++){
    const p={x:.06+Math.random()*.88,y:.10+Math.random()*.72};
    if(!taken || !taken.some(q=>Math.hypot(p.x-q.x,(p.y-q.y)*.75)<minDist)) return p;
  }
  return {x:.06+Math.random()*.88,y:.10+Math.random()*.72};
}

let currentEls=[];

function exitCurrent(){
  return new Promise(resolve=>{
    if(!currentEls.length) return resolve();
    currentEls.forEach(el=>{
      const p=randomScatterPoint();
      el.style.transition=`transform ${EXIT_MS}ms cubic-bezier(.4,0,1,1), opacity ${EXIT_MS}ms ease`;
      el.style.transform=`translate(${p.x*stage.clientWidth}px,${p.y*stage.clientHeight}px) translate(-50%,-50%)`;
      el.style.opacity='0';
    });
    setTimeout(()=>{
      currentEls.forEach(el=>el.remove());
      currentEls=[];
      resolve();
    },EXIT_MS+30);
  });
}

function enterVariant(variantId){
  const targets=computeLayout(variantId);
  const takenStarts=[];
  const els=targets.map(t=>{
    const el=document.createElement('span');
    el.className='glyph';
    el.textContent=t.ch;
    const start=randomScatterPoint(takenStarts);
    takenStarts.push(start);
    el.style.opacity='0';
    el.style.transform=`translate(${start.x*stage.clientWidth}px,${start.y*stage.clientHeight}px) translate(-50%,-50%)`;
    stage.appendChild(el);
    return {el,t};
  });
  // Force the scattered start to apply before animating to target.
  void stage.offsetWidth;
  els.forEach(({el,t})=>{
    const delay=Math.random()*ENTER_STAGGER_MAX;
    setTimeout(()=>{
      el.style.transition=`transform ${ENTER_MS}ms cubic-bezier(.16,.84,.24,1), opacity 260ms ease`;
      el.style.opacity='1';
      el.style.transform=`translate(${t.x*stage.clientWidth}px,${t.y*stage.clientHeight}px) translate(-50%,-50%)`;
    },delay);
  });
  currentEls=els.map(e=>e.el);
  hudPhase.textContent=variantId;
}

let orderIdx=-1;
async function cycle(){
  orderIdx=(orderIdx+1)%ORDER.length;
  await exitCurrent();
  enterVariant(ORDER[orderIdx]);
  setTimeout(cycle,DWELL_MS+ENTER_MS+ENTER_STAGGER_MAX);
}

enterVariant(ORDER[0]);
orderIdx=0;
setTimeout(cycle,DWELL_MS);

addEventListener('resize',()=>{
  // Re-place current letters at their (recomputed) exact targets without a
  // fresh scatter, so a resize mid-dwell doesn't look like a re-entry.
  const targets=computeLayout(ORDER[orderIdx]);
  currentEls.forEach((el,i)=>{
    const t=targets[i];
    if(!t) return;
    el.style.transition='none';
    el.style.transform=`translate(${t.x*stage.clientWidth}px,${t.y*stage.clientHeight}px) translate(-50%,-50%)`;
  });
});
})();
</script>
</body>
</html>
