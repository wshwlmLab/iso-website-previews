/* ===== v38 BRIDGE ONLY: v35 motion → exact frozen Soglia =====
   The frozen threshold DOM and erase system remain untouched underneath. */

<script>
(() => {
let PHOTO_SRC = [];

// ---------- baseline menu ----------
const words=[...document.querySelectorAll('.word')];
words.forEach(w=>{
  const s=w.dataset.label;
  w.textContent='';
  const inner=document.createElement('span');
  inner.className='word-inner';
  [...s].forEach(ch=>{const e=document.createElement('span');e.className='char';const f=document.createElement('span');f.className='char-flip';f.textContent=ch;e.appendChild(f);inner.appendChild(e)});
  w.appendChild(inner);
});
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function intro(){const cs=[...document.querySelectorAll('.char')];cs.forEach(c=>{c.style.opacity=0;c.style.transition='none'});shuffle(cs).forEach((c,i)=>setTimeout(()=>{c.style.transition='opacity 120ms ease';c.style.opacity=1},i*38+Math.random()*18))}
// ---------- v59: keep the v57 diamond and restore synchronized word flip ----------
// ---------- frozen hover precision 2026-08-28 ----------
// Keep the hit boxes completely stationary and transform only the inner glyphs.
// This prevents transformed ink from changing pointer hit-testing at the edges.
// Menu words: exact temporary hover state.
words.forEach(w=>{
  let inside=false;
  w.addEventListener('pointerenter',()=>{
    if(inside) return;
    inside=true;
    w.classList.add('is-hovered');
  });
  w.addEventListener('pointerleave',()=>{
    if(!inside) return;
    inside=false;
    w.classList.remove('is-hovered');
  });
});

// ---------- v42 click exit: selected word disappears in random letter order ----------
let menuClickBusy=false;
words.forEach(w=>{
  w.addEventListener('click',()=>{
    if(menuClickBusy||document.body.classList.contains('bridge-pre'))return;
    menuClickBusy=true;
    const chars=[...w.querySelectorAll('.char')];
    const order=shuffle(chars);
    order.forEach((c,i)=>setTimeout(()=>{
      c.style.transition='opacity 190ms ease';
      c.style.opacity='0';
    },i*72+Math.random()*40));
    const total=Math.max(420,(order.length-1)*72+230);
    setTimeout(()=>{
      const target=(w.dataset.label||'').toLowerCase();
      window.dispatchEvent(new CustomEvent('iso:navigate-request',{detail:{target}}));
      // Standalone Lab: route handoff is deliberately neutral until the common
      // page-entry grammar is designed. Keep a hash only as an observable hook.
      history.replaceState(null,'','#'+target);
      setTimeout(()=>{
        chars.forEach(c=>{c.style.transition='opacity 220ms ease';c.style.opacity='1'});
        menuClickBusy=false;
      },650);
    },total);
  });
});

// Corner identity words: start upside-down, toggle exactly once on each genuine
// pointer entry, and preserve the selected state after the pointer leaves.
const identities=[...document.querySelectorAll('.identity')];
identities.forEach(el=>{
  let inside=false;
  let flipped=false;
  el.addEventListener('pointerenter',()=>{
    if(inside) return;
    inside=true;
    flipped=!flipped;
    el.classList.toggle('identity-flipped',flipped);
  });
  el.addEventListener('pointerleave',()=>{
    inside=false;
  });
});

// ---------- optical flip axis ----------
// scaleY(-1) around the CSS line-box center can look like a vertical jump,
// because the font's real uppercase ink is not vertically centered inside
// that line box. Measure the actual glyph ink and rotate around its optical
// centre instead, so the visible top/bottom margins stay fixed in both states.
function setOpticalFlipAxes(){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const targets=[...document.querySelectorAll('.word-inner,.identity-inner,.char-flip')];

  targets.forEach(el=>{
    const parent=el.parentElement;
    const cs=getComputedStyle(parent);
    const fs=parseFloat(cs.fontSize)||16;
    const lhRaw=parseFloat(cs.lineHeight);
    const lh=Number.isFinite(lhRaw)?lhRaw:fs;
    const weight=cs.fontWeight||'400';
    const family=cs.fontFamily||'monospace';
    ctx.font=`${weight} ${fs}px ${family}`;

    const m=ctx.measureText(el.textContent||'H');
    const actualA=m.actualBoundingBoxAscent||fs*.72;
    const actualD=m.actualBoundingBoxDescent||fs*.02;

    let baselineY;
    if(Number.isFinite(m.fontBoundingBoxAscent) && Number.isFinite(m.fontBoundingBoxDescent)){
      const fA=m.fontBoundingBoxAscent, fD=m.fontBoundingBoxDescent;
      baselineY=(lh-(fA+fD))/2+fA;
    }else{
      // Fallback close to CSS font metrics; only used in older browsers.
      baselineY=lh*.78;
    }

    const inkCenterY=baselineY+(actualD-actualA)/2;
    el.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
    parent.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
  });
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(setOpticalFlipAxes);
}else{
  requestAnimationFrame(setOpticalFlipAxes);
}
window.addEventListener('resize',setOpticalFlipAxes,{passive:true});

// ---------- clock ----------
function clock(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',hour12:false}).format(n);document.getElementById('year').textContent=n.getFullYear()}
clock();setInterval(clock,15000);

// ---------- border snake ----------
const path=document.getElementById('snakePath'),group=document.getElementById('snakeChars');
const glyphs=[];
const borderLen=path.getTotalLength(),speed=6.375,targetGlyphs=340;
let gap=borderLen/targetGlyphs;
function setCartolinaBorder(config){
  const phrase=[config.borderLabel,...config.borderWords].join(' · ').toLocaleUpperCase('it-IT')+' · ';
  const copies=Math.max(1,Math.floor(targetGlyphs/Array.from(phrase).length));
  group.replaceChildren();
  glyphs.length=0;
  for(const ch of phrase.repeat(copies)){
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.textContent=ch;
    t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","middle");
    group.appendChild(t);
    glyphs.push(t);
  }
  gap=borderLen/glyphs.length;
}
// The approved path is a square. Read its four corners once, then move the
// letters arithmetically instead of interleaving SVG writes and geometry reads.
const snakeCorners=Array.from({length:4},(_,index)=>path.getPointAtLength(index*borderLen/4));
const snakeP=new Float64Array(2),snakeQ=new Float64Array(2);
function snakePoint(distance,point){
  const position=((distance%borderLen)+borderLen)%borderLen;
  const segment=Math.min(3,Math.floor(position/(borderLen/4)));
  const t=position/(borderLen/4)-segment;
  const a=snakeCorners[segment],b=snakeCorners[(segment+1)%4];
  point[0]=a.x+(b.x-a.x)*t;
  point[1]=a.y+(b.y-a.y)*t;
}
function snake(ms){
  const base=(ms/1000*speed)%borderLen;
  for(let i=0;i<glyphs.length;i++){
    const s=(base+i*gap)%borderLen;
    snakePoint(s,snakeP);snakePoint(s+.12,snakeQ);
    const a=Math.atan2(snakeQ[1]-snakeP[1],snakeQ[0]-snakeP[0])*180/Math.PI;
    glyphs[i].setAttribute("transform",`translate(${snakeP[0]} ${snakeP[1]}) rotate(${a})`);
  }
  requestAnimationFrame(snake)
}

// ---------- erase system v5: generic monotonic layer loop ----------
const moduleEl=document.getElementById('module');
const viewport=document.getElementById('viewport');
const white=document.getElementById('whiteCover');
const c1=document.getElementById('img1'),c2=document.getElementById('img2'),c3=document.getElementById('img3');
const ctx1=c1.getContext('2d');
const wctx=white.getContext('2d');
const stone=document.getElementById('stone');

let imgs=[];
let drawing=false;
let lastPointer=null;
let pathDistance=0;
let stage=0;
let seed=1;

// Global unlock rules requested by William:
// - layer 2 becomes available after 99% of layer 1 has been discovered
//   (here: 99% of the white veil removed, so photo 1 is essentially revealed)
// - every following photo starts after 90% of the current transition
const THRESHOLD_2=0.995;
const THRESHOLD_NEXT_PHOTO=0.90;
const HALF_WHITE=46.7;
const HALF_IMG1=23.3;
const HALF_IMG2=15.7;
const GUARD_RADIUS=60;
const GUARD_MAX_DENSITY=0.12;

// The new engine does not interpolate points at fixed intervals.
// It processes the whole swept segment between pointer samples, so fast motion
// cannot leave geometric gaps.
let MW=1,MH=1,VW=1,VH=1,OFFX=0,OFFY=0;
let whiteAlive=null;
let whiteRemaining=0;
let lastAdvance=null;
let whitePixels=null;
let displayPixels=null;
let sourcePixels=[];

let dirtyWhite=null;
let dirtyPhoto=null;
let TOTAL_PHOTO_PIXELS=0;
let photoStep=null;
let photoState=null;
let visiblePhotoCounts=null;
let activeStep=0;
let currentTargetReached=0;
let guardWhiteIntegral=null;
let guardPhotoIntegral=null;
let guardDirty=true;
let loopCount=0;
let pendingPointerPoints=[];
let pointerFrame=0;
let pointerRect=null;
let guardWhiteDirty=true,guardPhotoDirty=true,guardBlockerStep=-1;

function rects(){
  const mr=moduleEl.getBoundingClientRect(),vr=viewport.getBoundingClientRect();
  return {mr,vr,offX:vr.left-mr.left,offY:vr.top-mr.top};
}

function resetDirty(){
  dirtyWhite={minX:Infinity,minY:Infinity,maxX:-1,maxY:-1};
  dirtyPhoto={minX:Infinity,minY:Infinity,maxX:-1,maxY:-1};
}
function markDirty(d,x,y){
  if(x<d.minX)d.minX=x;
  if(y<d.minY)d.minY=y;
  if(x>d.maxX)d.maxX=x;
  if(y>d.maxY)d.maxY=y;
}
function flushDirty(){
  if(dirtyWhite.maxX>=dirtyWhite.minX){
    wctx.putImageData(
      whitePixels,0,0,
      dirtyWhite.minX,dirtyWhite.minY,
      dirtyWhite.maxX-dirtyWhite.minX+1,
      dirtyWhite.maxY-dirtyWhite.minY+1
    );
  }
  if(dirtyPhoto.maxX>=dirtyPhoto.minX){
    ctx1.putImageData(
      displayPixels,0,0,
      dirtyPhoto.minX,dirtyPhoto.minY,
      dirtyPhoto.maxX-dirtyPhoto.minX+1,
      dirtyPhoto.maxY-dirtyPhoto.minY+1
    );
  }
}

function buildCoverPixels(im,w,h){
  const oc=document.createElement('canvas');
  oc.width=w; oc.height=h;
  const ox=oc.getContext('2d',{willReadFrequently:true});
  const scale=Math.max(w/im.width,h/im.height);
  const dw=im.width*scale,dh=im.height*scale;
  ox.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
  return ox.getImageData(0,0,w,h);
}

function size(){
  const R=rects();
  MW=Math.max(1,Math.round(R.mr.width));
  MH=Math.max(1,Math.round(R.mr.height));
  VW=Math.max(1,Math.round(R.vr.width));
  VH=Math.max(1,Math.round(R.vr.height));
  OFFX=Math.round(R.offX);
  OFFY=Math.round(R.offY);

  c1.width=VW; c1.height=VH;
  c2.width=VW; c2.height=VH;
  c3.width=VW; c3.height=VH;
  white.width=MW; white.height=MH;

  whiteAlive=new Uint8Array(MW*MH);
  whiteAlive.fill(1);
  whiteRemaining=MW*MH;

  // One distance memory per module pixel. A point may advance only one layer
  // per local pass; after travelling away and coming back during the same click,
  // it can advance again.
  lastAdvance=new Float32Array(MW*MH);
  lastAdvance.fill(-1e9);

  TOTAL_PHOTO_PIXELS=VW*VH;
  photoStep=new Uint32Array(TOTAL_PHOTO_PIXELS);
  photoState=new Uint8Array(TOTAL_PHOTO_PIXELS);
  photoState.fill(1);
  visiblePhotoCounts=new Uint32Array(imgs.length);
  activeStep=0;
  currentTargetReached=0;
  guardWhiteIntegral=new Uint32Array((MW+1)*(MH+1));
  guardPhotoIntegral=new Uint32Array((VW+1)*(VH+1));
  guardDirty=true;
  guardWhiteDirty=true;guardPhotoDirty=true;guardBlockerStep=-1;
  pointerRect=R.mr;
  loopCount=0;
  pendingPointerPoints=[];
  if(pointerFrame) cancelAnimationFrame(pointerFrame);
  pointerFrame=0;

  sourcePixels=imgs.map(im=>buildCoverPixels(im,VW,VH));
  displayPixels=ctx1.createImageData(VW,VH);
  displayPixels.data.set(sourcePixels[0].data);
  ctx1.putImageData(displayPixels,0,0);

  whitePixels=wctx.createImageData(MW,MH);
  const d=whitePixels.data;
  for(let i=0;i<d.length;i+=4){
    d[i]=255; d[i+1]=255; d[i+2]=255; d[i+3]=255;
  }
  wctx.putImageData(whitePixels,0,0);

  stage=0;
  pathDistance=0;
  lastPointer=null;
  resetDirty();
}

function layerCount(){return Math.max(1,sourcePixels.length)}

function updateStage(){
  if(activeStep===0){
    const whiteErased=1-(whiteRemaining/(MW*MH));
    if(whiteErased>=THRESHOLD_2){
      activeStep=1;
      stage=1;
      currentTargetReached=0;
    }
    return;
  }

  const targetReady=currentTargetReached/Math.max(1,TOTAL_PHOTO_PIXELS)>=THRESHOLD_NEXT_PHOTO;
  // The loop is global and continuous: once 90% reaches the current target,
  // the next transition opens even if a few older pixels remain elsewhere.
  // Those pixels keep advancing locally one layer at a time and never freeze.
  if(targetReady){
    activeStep++;
    stage=activeStep;
    currentTargetReached=0;
    loopCount=Math.floor(activeStep/layerCount());
  }
}

function rebuildGuardSnapshot(){
  // The white-cover guard remains density based so isolated antialiased crumbs
  // cannot stop the first photo transition.
  if(guardWhiteDirty){
  guardWhiteIntegral.fill(0);
  const whiteStride=MW+1;
  for(let y=0;y<MH;y++){
    let rowSum=0;
    const srcRow=y*MW;
    const intRow=(y+1)*whiteStride;
    const prevRow=y*whiteStride;
    for(let x=0;x<MW;x++){
      if(whiteAlive[srcRow+x]) rowSum++;
      guardWhiteIntegral[intRow+x+1]=guardWhiteIntegral[prevRow+x+1]+rowSum;
    }
  }
  guardWhiteDirty=false;
  }

  // One summed-area table marks pixels that are older than the current source
  // layer. The query is O(1) per erased pixel and works for any layer count.
  const blockerStep=Math.max(0,activeStep-1);
  if(!guardPhotoDirty&&guardBlockerStep===blockerStep)return;
  guardPhotoIntegral.fill(0);
  const photoStride=VW+1;
  for(let y=0;y<VH;y++){
    let rowSum=0;
    const srcRow=y*VW;
    const intRow=(y+1)*photoStride;
    const prevRow=y*photoStride;
    for(let x=0;x<VW;x++){
      if(photoStep[srcRow+x]<blockerStep) rowSum++;
      guardPhotoIntegral[intRow+x+1]=guardPhotoIntegral[prevRow+x+1]+rowSum;
    }
  }
  guardPhotoDirty=false;guardBlockerStep=blockerStep;
}

function whiteGuardAllows(vx,vy){
  const mx=vx+OFFX,my=vy+OFFY,r=GUARD_RADIUS;
  const x0=Math.max(0,mx-r),x1=Math.min(MW-1,mx+r);
  const y0=Math.max(0,my-r),y1=Math.min(MH-1,my+r);
  const stride=MW+1;
  const count=
    guardWhiteIntegral[(y1+1)*stride+x1+1]-guardWhiteIntegral[(y1+1)*stride+x0]-
    guardWhiteIntegral[y0*stride+x1+1]+guardWhiteIntegral[y0*stride+x0];
  const area=(x1-x0+1)*(y1-y0+1);
  return count/Math.max(1,area)<=GUARD_MAX_DENSITY;
}

function guardAllowsTransition(step,vx,vy){
  if(step===0) return whiteGuardAllows(vx,vy);
  // Lagging pixels always get priority so they can catch up instead of being
  // frozen by the global phase. The active source keeps the 60px guard rail.
  if(step<activeStep-1) return true;
  const r=GUARD_RADIUS;
  const x0=Math.max(0,vx-r),x1=Math.min(VW-1,vx+r);
  const y0=Math.max(0,vy-r),y1=Math.min(VH-1,vy+r);
  const stride=VW+1;
  const count=
    guardPhotoIntegral[(y1+1)*stride+x1+1]-guardPhotoIntegral[(y1+1)*stride+x0]-
    guardPhotoIntegral[y0*stride+x1+1]+guardPhotoIntegral[y0*stride+x0];
  const area=(x1-x0+1)*(y1-y0+1);
  return count/Math.max(1,area)<=GUARD_MAX_DENSITY;
}

function modulePoint(cx,cy){
  const r=pointerRect||moduleEl.getBoundingClientRect();
  return {x:cx-r.left,y:cy-r.top};
}

function insideViewport(x,y){
  return x>=OFFX && y>=OFFY && x<OFFX+VW && y<OFFY+VH;
}

function organicNoise(x,y,amp){
  // Soft, low-amplitude edge variation: keeps the previously approved
  // torn-paper character without returning to a spiky outline.
  const a=Math.sin(x*0.165+y*0.115+seed*0.000003);
  const b=Math.sin(x*0.071-y*0.094+1.7);
  return (a*0.65+b*0.35)*amp;
}

function radiusForStep(step){
  return step===0 ? HALF_IMG1 : HALF_IMG2;
}

function cooldownAfterRadius(r){
  // Store the distance at which this exact point may advance again.
  // Crucially this uses the radius of the layer JUST changed, not the
  // smaller radius of the layer underneath. That prevents one fast straight
  // sweep from revealing two layers at the same point.
  return Math.max(34,r*2+12);
}

function copyPhotoPixel(photoIndex,pi){
  const src=sourcePixels[photoIndex-1].data;
  const dst=displayPixels.data;
  const o=pi*4;
  dst[o]=src[o];
  dst[o+1]=src[o+1];
  dst[o+2]=src[o+2];
  dst[o+3]=255;
}

function processCapsule(a,b,pathStart){
  const dx=b.x-a.x,dy=b.y-a.y;
  const segLen=Math.hypot(dx,dy);
  const segLen2=dx*dx+dy*dy;
  const maxR=HALF_WHITE+3;

  const minX=Math.max(0,Math.floor(Math.min(a.x,b.x)-maxR));
  const maxX=Math.min(MW-1,Math.ceil(Math.max(a.x,b.x)+maxR));
  const minY=Math.max(0,Math.floor(Math.min(a.y,b.y)-maxR));
  const maxY=Math.min(MH-1,Math.ceil(Math.max(a.y,b.y)+maxR));

  for(let y=minY;y<=maxY;y++){
    const py=y+0.5;
    const row=y*MW;
    let rowMinX=minX,rowMaxX=maxX;
    if(Math.abs(dy)>0.0001){
      const t0=Math.max(0,Math.min(1,(py-maxR-a.y)/dy));
      const t1=Math.max(0,Math.min(1,(py+maxR-a.y)/dy));
      rowMinX=Math.max(minX,Math.floor(Math.min(a.x+dx*t0,a.x+dx*t1)-maxR));
      rowMaxX=Math.min(maxX,Math.ceil(Math.max(a.x+dx*t0,a.x+dx*t1)+maxR));
    }
    for(let x=rowMinX;x<=rowMaxX;x++){
      const px=x+0.5;
      const mi=row+x;

      let kind=null;
      let currentStep=0;
      let radius=0;

      if(whiteAlive[mi]){
        kind='white';
        radius=HALF_WHITE;
      }else if(insideViewport(x,y)){
        const vx=x-OFFX,vy=y-OFFY;
        const pi=vy*VW+vx;
        currentStep=photoStep[pi];
        if(activeStep===0 || currentStep>=activeStep) continue;
        kind='photo';
        radius=radiusForStep(currentStep);
      }else{
        continue;
      }

      let t=segLen2<0.0001 ? 0 : ((px-a.x)*dx+(py-a.y)*dy)/segLen2;
      if(t<0)t=0; else if(t>1)t=1;
      const qx=px-(a.x+dx*t),qy=py-(a.y+dy*t);
      const d2=qx*qx+qy*qy;
      const edgeAmp=(kind==='white') ? 1.7 : (currentStep===0 ? 1.15 : 0.9);
      // The noise cannot exceed edgeAmp. Reject distant cells before computing
      // its two sine functions, without changing a single brush-edge pixel.
      if(d2>(radius+edgeAmp)*(radius+edgeAmp))continue;
      const effectiveR=radius+organicNoise(x,y,edgeAmp);
      if(d2>effectiveR*effectiveR) continue;

      const travelHere=pathStart+t*segLen;
      if(travelHere < lastAdvance[mi]) continue;

      if(kind==='white'){
        whiteAlive[mi]=0;
        whiteRemaining--;
        if(insideViewport(x,y)){
          const pi=(y-OFFY)*VW+(x-OFFX);
          visiblePhotoCounts[photoState[pi]-1]++;
        }
        const o=mi*4;
        whitePixels.data[o+3]=0;
        guardDirty=true;
        guardWhiteDirty=true;
        lastAdvance[mi]=travelHere+cooldownAfterRadius(HALF_WHITE);
        markDirty(dirtyWhite,x,y);
      }else{
        const vx=x-OFFX,vy=y-OFFY;
        const pi=vy*VW+vx;

        // A blocked pixel receives no cooldown. As soon as its guard rail is
        // clear it responds on the very next pointer sample.
        if(!guardAllowsTransition(currentStep,vx,vy)) continue;

        const nextStep=currentStep+1;
        const nextLayer=(nextStep%layerCount())+1;
        visiblePhotoCounts[photoState[pi]-1]--;
        visiblePhotoCounts[nextLayer-1]++;
        photoStep[pi]=nextStep;
        photoState[pi]=nextLayer;
        copyPhotoPixel(nextLayer,pi);
        guardDirty=true;
        guardPhotoDirty=true;
        if(nextStep===activeStep) currentTargetReached++;
        lastAdvance[mi]=travelHere+cooldownAfterRadius(radius);
        markDirty(dirtyPhoto,vx,vy);
      }
    }
  }
}

function processSweptSegment(a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  const segLen=Math.hypot(dx,dy);
  processCapsule(a,b,pathDistance);
  pathDistance+=segLen;
}

function processPointerPoint(p){
  if(!lastPointer){
    processSweptSegment(p,p);
    lastPointer=p;
    return;
  }
  processSweptSegment(lastPointer,p);
  lastPointer=p;
}

function moveStone(e){
  stone.style.left=e.clientX+'px';
  stone.style.top=e.clientY+'px';
}

function flushPointerQueue(){
  pointerFrame=0;
  if(!drawing || !pendingPointerPoints.length) return;
  const points=pendingPointerPoints;
  pendingPointerPoints=[];
  resetDirty();

  // One generic guard snapshot per frame, regardless of whether PHOTO_SRC
  // contains three, five, or more layers.
  if(activeStep>0 && guardDirty){
    rebuildGuardSnapshot();
    guardDirty=false;
  }

  for(const point of points) processPointerPoint(point);
  flushDirty();
  updateStage();
  if(pendingPointerPoints.length) pointerFrame=requestAnimationFrame(flushPointerQueue);
}

function queuePointerEvent(e){
  const coalesced=e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  const events=coalesced && coalesced.length ? coalesced : [e];
  for(const ev of events){
    const p=modulePoint(ev.clientX,ev.clientY);
    const prev=pendingPointerPoints[pendingPointerPoints.length-1];
    if(!prev || prev.x!==p.x || prev.y!==p.y) pendingPointerPoints.push(p);
  }
  if(!pointerFrame) pointerFrame=requestAnimationFrame(flushPointerQueue);
}

function eraseCursorCanReveal(){
  return !document.body.classList.contains('bridge-pre');
}
function revealEraseCursor(e){
  if(!eraseCursorCanReveal()) return false;
  moduleEl.classList.add('erase-cursor-live');
  stone.classList.add('visible');
  if(e) moveStone(e);
  return true;
}
function hideEraseCursor(){
  stone.classList.remove('visible','active');
  moduleEl.classList.remove('erase-cursor-live');
}

moduleEl.onpointerenter=e=>{
  moveStone(e);
  // If the pointer enters only after the threshold is already visible,
  // the entry itself is the first intentional interaction: reveal immediately.
  if(eraseCursorCanReveal()) revealEraseCursor(e);
  else hideEraseCursor();
};

moduleEl.onpointerleave=()=>{
  if(!drawing) hideEraseCursor();
};

function drawFromPointerEvent(e){
  if(drawing && e.pointerType==='mouse' && !(e.buttons&1)){
    stop(e);
    return;
  }
  // Recover immediately if a browser dropped pointerdown/pointer-capture while
  // the primary button is visibly still held.
  if(!drawing && (e.buttons&1)){
    drawing=true;
    lastPointer=null;
    pathDistance=0;
    lastAdvance.fill(-1e9);
    stone.classList.add('active');
  }
  if(!drawing) return;
  queuePointerEvent(e);
}

moduleEl.onpointermove=e=>{
  moveStone(e);
  // v39: when the threshold appears underneath a stationary pointer, keep the
  // normal arrow and do NOT reveal the erase cursor. The first real movement
  // inside the module switches to the custom erase cursor.
  if(eraseCursorCanReveal() && !stone.classList.contains('visible')) revealEraseCursor(e);
  // Coalesced standard pointer samples plus swept segments are enough to retain
  // the complete path without the duplicate workload of pointerrawupdate.
  drawFromPointerEvent(e);
};

moduleEl.onpointerdown=e=>{
  if(!whiteAlive)return;
  pointerRect=moduleEl.getBoundingClientRect();
  if(eraseCursorCanReveal()) revealEraseCursor(e);
  drawing=true;
  seed=((e.clientX*73856093)^(e.clientY*19349663))>>>0;
  lastPointer=null;
  pathDistance=0;
  lastAdvance.fill(-1e9);
  pendingPointerPoints=[];
  stone.classList.add('active');
  moduleEl.setPointerCapture?.(e.pointerId);
  moveStone(e);
  queuePointerEvent(e);
};

function stop(e){
  // Process the release coordinate too: a quick gesture may end between the
  // final move sample and pointerup, and that short tail must not be lost.
  if(drawing){
    if(e && Number.isFinite(e.clientX) && Number.isFinite(e.clientY)) queuePointerEvent(e);
    if(pointerFrame){cancelAnimationFrame(pointerFrame);pointerFrame=0}
    if(pendingPointerPoints.length) flushPointerQueue();
  }
  drawing=false;
  lastPointer=null;
  stone.classList.remove('active');
  try{if(e)moduleEl.releasePointerCapture?.(e.pointerId)}catch(_){}
}
moduleEl.onpointerup=stop;
moduleEl.onpointercancel=stop;
moduleEl.onlostpointercapture=e=>{if(drawing)stop(e)};
window.addEventListener('blur',()=>{if(drawing)stop(null)});

window.__resetEraseCursorForThreshold=hideEraseCursor;

function ratioAtStep(step){
  if(!TOTAL_PHOTO_PIXELS) return 0;
  let count=0;
  for(let i=0;i<TOTAL_PHOTO_PIXELS;i++) if(photoStep[i]>=step) count++;
  return count/TOTAL_PHOTO_PIXELS;
}

function stepSummary(){
  const counts={};
  for(let i=0;i<TOTAL_PHOTO_PIXELS;i++){
    const key=photoStep[i];
    counts[key]=(counts[key]||0)+1;
  }
  return counts;
}

window.__eraseDebug={
  get stage(){return stage},
  get whiteErasedRatio(){return 1-(whiteRemaining/(MW*MH))},
  get layer2DiscoveredRatio(){return ratioAtStep(1)},
  get layer3DiscoveredRatio(){return ratioAtStep(2)},
  get layerCount(){return layerCount()},
  get activeStep(){return activeStep},
  get cyclePhase(){return activeStep===0 ? 0 : ((activeStep-1)%layerCount())+1},
  get activeLayer(){return activeStep===0 ? 1 : (activeStep%layerCount())+1},
  get phaseProgress(){
    return activeStep===0
      ? 1-(whiteRemaining/(MW*MH))
      : currentTargetReached/Math.max(1,TOTAL_PHOTO_PIXELS);
  },
  get loopCount(){return loopCount},
  get stepSummary(){return stepSummary()},
  get photoStep(){return photoStep},
  get photoState(){return photoState},
  get visiblePhotoCounts(){return visiblePhotoCounts ? Array.from(visiblePhotoCounts) : []},
  get visiblePhotoRatios(){return visiblePhotoCounts ? Array.from(visiblePhotoCounts,count=>count/Math.max(1,TOTAL_PHOTO_PIXELS)) : []},
  get dimensions(){return {MW,MH,VW,VH,OFFX,OFFY}}
};


function setCursorMode(mode){
  stone.classList.remove('mode-clear','mode-ink');
  stone.classList.add('mode-'+mode);
}

let prepared=null;
let introPrepared=null;
window.__showSogliaIntro=()=>{
  if(introPrepared)return introPrepared;
  introPrepared=(async()=>{
    if(document.fonts)await document.fonts.ready;
    setOpticalFlipAxes();
    window.__prepareSogliaIntro();
    window.__startSogliaIntro();
  })();
  return introPrepared;
};
window.__prepareFrozenSoglia=()=>{
  if(prepared)return prepared;
  prepared=(async()=>{
    const config=await window.ISOCartolina.load();
    setCartolinaBorder(config);
    PHOTO_SRC=config.layers.map(layer=>layer.image);
    imgs=await Promise.all(config.layers.map(layer=>window.ISOExperienceLoader.image(layer.image,layer.imageSHA256)));
    if(document.fonts){
      await document.fonts.ready;
      if([...document.fonts].some(font=>font.status==='error'))throw new Error('Font non disponibile');
    }
    setOpticalFlipAxes();
    size();
    window.__sogliaAssetsReady=true;
  })().catch(error=>{prepared=null;window.__cartolinaLoadError=error.message;throw error});
  return prepared;
};
window.__startSogliaExperience=()=>{
  if(!window.__sogliaAssetsReady||window.__frozenSogliaReady)return;
  window.__frozenSogliaReady=true;
  window.__cartolinaLoadError=null;
  window.__resumeSogliaThreshold?.();
};
let borderStarted=false;
window.__startSogliaBorder=()=>{if(!borderStarted){borderStarted=true;requestAnimationFrame(snake)}};

window.addEventListener('resize',()=>{if(imgs.length)size()});
})();
</script>

<script id="v40-bridge-script">
(()=>{
const stage=document.getElementById('motionStage');
const stateLabel=document.getElementById('motionState');

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

// v23: kinetic curve inspired by the reference motion.
// The gesture does NOT launch at full speed:
// it starts moderately, accelerates briefly, then spends most of its time
// decelerating and settling into the destination.
function kineticCurve(t, startSpeed=.15, peakSpeed=1.25, accelPortion=.22){
  t=clamp(t);
  const a=accelPortion;
  const area1=a*(startSpeed+peakSpeed)/2;
  const area2=(1-a)*peakSpeed/2;
  const total=area1+area2;

  let area;
  if(t<=a){
    const k=(peakSpeed-startSpeed)/a;
    area=startSpeed*t + .5*k*t*t;
  }else{
    const s=t-a;
    const d=1-a;
    area=area1 + peakSpeed*s - .5*(peakSpeed/d)*s*s;
  }
  return clamp(area/total);
}

// Main family: gentle start, short acceleration, long deceleration.
const easeOutFluid=t=>kineticCurve(t,.15,1.25,.22);

// The few punctuation accents remain a little firmer, but no longer snap.
const easeOutAccent=t=>kineticCurve(t,.24,1.32,.18);

const easeOutOpen=easeOutFluid;
const easeOutMove=easeOutFluid;

// Direction-aware mapping so opening and closing share the same physical feel.
const smooth=t=>{
  t=clamp(t);
  return animationDirection==="open"
    ? easeOutFluid(t)
    : 1-easeOutFluid(1-t);
};

const mech=t=>{
  t=clamp(t);
  return animationDirection==="open"
    ? easeOutFluid(t)
    : 1-easeOutFluid(1-t);
};

const accent=t=>{
  t=clamp(t);
  return animationDirection==="open"
    ? easeOutAccent(t)
    : 1-easeOutAccent(1-t);
};

// v26 — ONLY whole-word translations get a softer departure.
// Arrival remains long and soft, while initial velocity is much lower.
const easeWordMove=t=>kineticCurve(t,.025,1.18,.30);
const easeWordMoveAccent=t=>kineticCurve(t,.045,1.22,.27);

const wordMove=t=>{
  t=clamp(t);
  return animationDirection==="open"
    ? easeWordMove(t)
    : 1-easeWordMove(1-t);
};

const wordMoveAccent=t=>{
  t=clamp(t);
  return animationDirection==="open"
    ? easeWordMoveAccent(t)
    : 1-easeWordMoveAccent(1-t);
};

const rowY=[.415,.495,.575];

// compact state uses the frozen three-row grid; only the words inside it change.

    punctAfter:{SUONO:'.',RELAZIONI:',',IMMAGINI:',',SPAZI:',',STORIE:'.',NASCONO:',',FORME:'.'}

};

let sentenceVariantIndex=-1;
let sentenceVariant='F';
let activeSentenceKeys=new Set();

const words={
  SUONO:{text:"SUONO",start:[.405,rowY[0]],end:[.405,rowY[0]],delay:0,dur:1,mode:"anchor"},
  CHE:{text:"CHE",start:[.355,rowY[2]],end:[.355,.650],delay:.28,dur:.15,mode:"move"}

const glyphWords={

      [.610,.155],[.720,.155],[.830,.155],[.940,.155],

    ]
  },

  // RE stays exactly where it begins.
  // LAZIONI moves down mechanically, as the former whole RELAZIONI did.
  RELAZIONI:{
    text:"RELAZIONI",center:[.760,rowY[0]],delay:.045,dur:.20,mode:"relazioniLUp"
  },

  IMMAGINI:{
    text:"IMMAGINI",center:[.260,rowY[1]],delay:.25,dur:.61,mode:"immagini"
  },

  SPAZI:{
    text:"SPAZI",center:[.445,rowY[1]],delay:.40,dur:.48,mode:"simpleSmooth",
    targets:[[.390,rowY[1]],[.445,rowY[1]],[.500,rowY[1]],[.555,rowY[1]],[.610,rowY[1]]]
  },

  // Mechanical downward translation + gentle smooth tracking expansion.

    text:"STORIE",center:[.620,rowY[1]],delay:.16,dur:.35,mode:"storie"
  },

    text:"CREANO",center:[.500,rowY[2]],delay:.39,dur:.72,mode:"creano",

const wordNodes={},glyphNodes={},starts={},sentenceCenters={},sentencePunctuation={};

function addWord(k,s){
  const el=document.createElement('div');
  el.className='word';
  [...s.text].forEach(ch=>{const span=document.createElement('span');span.className='motion-letter';span.textContent=ch;el.appendChild(span)});
  stage.appendChild(el);
  wordNodes[k]=el;
}

function charMetrics(text,center){
  const fs=Math.max(22,Math.min(stage.clientWidth*.0242,37.4));
  const cw=fs*.62;
  const total=cw*text.length;
  let x=center[0]*stage.clientWidth-total/2+cw/2;
  const arr=[];
  for(let i=0;i<text.length;i++){
    arr.push([x/stage.clientWidth,center[1]]);
    x+=cw;
  }
  return arr;
}

function addGlyphWord(k,s){
  glyphNodes[k]=[];
  for(const ch of s.text){
    const el=document.createElement('span');
    el.className='glyph';
    el.textContent=ch;
    stage.appendChild(el);
    glyphNodes[k].push(el);
  }
}

Object.entries(words).forEach(([k,s])=>addWord(k,s));
Object.entries(glyphWords).forEach(([k,s])=>addGlyphWord(k,s));

const punctWrap=document.getElementById('sentencePunctuation');
const punctNodes={};
function ensurePunctuationNodes(){
  punctWrap.innerHTML='';
  for(const [k,s] of Object.entries(sentencePunctuation)){
    const el=document.createElement('div');
    el.className='punct';
    el.textContent=s.text;
    punctWrap.appendChild(el);
    punctNodes[k]=el;
  }
}

function stageCenterFor(k){
  if(words[k]) return words[k].start;
  return glyphWords[k].center;
}
function textFor(k){
  return words[k] ? words[k].text : glyphWords[k].text;
}
function normalWordWidthNorm(text){
  const fs=Math.max(22,Math.min(stage.clientWidth*.0242,37.4));
  const cw=fs*.62;
  return (cw*text.length)/stage.clientWidth;
}
function normalSpaceNorm(){
  const fs=Math.max(22,Math.min(stage.clientWidth*.0242,37.4));
  return (fs*.62)/stage.clientWidth; // exactly one monospaced space
}
function computeSentenceCenters(){
  const variant=SENTENCE_VARIANTS[sentenceVariant];
  const rows=variant.rows;
  const punctAfter=variant.punctAfter;
  const gap=normalSpaceNorm();
  const fs=Math.max(22,Math.min(stage.clientWidth*.0242,37.4));
  const cw=fs*.62/stage.clientWidth;

  Object.keys(sentenceCenters).forEach(k=>delete sentenceCenters[k]);
  Object.keys(sentencePunctuation).forEach(k=>delete sentencePunctuation[k]);

  // Exact frozen grid measured from the approved compact reference.
  // The row starts and baselines never change between F, L and M.
  // v68 — same vertical centre, with a little more air than v67 while still
  // remaining substantially tighter than the original frozen spacing.
  // These shared endpoints are used for both arrival and departure.
  const rowYTarget=[163/394,188.5/394,212.5/394];
  const frozenRow1Left=238/1144;
  const frozenRow2Left=frozenRow1Left+6*cw;
  const frozenRow3Left=frozenRow2Left+(300-369)/1144;
  const frozenRows=SENTENCE_VARIANTS.F.rows;
  const frozenPunctuation=SENTENCE_VARIANTS.F.punctAfter;
  const frozenRowLeft=[frozenRow1Left,frozenRow2Left,frozenRow3Left];
  let frozenMinX=Infinity,frozenMaxX=-Infinity;
  frozenRows.forEach((row,rowIndex)=>{
    let cursor=frozenRowLeft[rowIndex];
    row.forEach((k,idx)=>{
      const w=normalWordWidthNorm(textFor(k));
      frozenMinX=Math.min(frozenMinX,cursor);
      cursor+=w;
      if(frozenPunctuation[k]) cursor+=cw;
      frozenMaxX=Math.max(frozenMaxX,cursor);
      if(idx<row.length-1) cursor+=gap;
    });
  });
  const frozenBlockShift=.5-(frozenMinX+frozenMaxX)/2;
  const rowLeft=frozenRowLeft.map(x=>x+frozenBlockShift);
  const punctuationTargets=[[.105,.245],[.885,.345],[.205,.825],[.835,.845],[.12,.72],[.90,.68]];
  let punctuationIndex=0;
  activeSentenceKeys=new Set(rows.flat());

  rows.forEach((row,rowIndex)=>{
    let cursor=rowLeft[rowIndex];
    const y=rowYTarget[rowIndex];
    for(let idx=0; idx<row.length; idx++){
      const k=row[idx];
      const w=normalWordWidthNorm(textFor(k));
      sentenceCenters[k]=[cursor+w/2,y];
      cursor+=w;

      if(punctAfter[k]){
        const punctKey=k+'_P';
        const home=[cursor+cw/2,y];
        const target=punctuationTargets[punctuationIndex%punctuationTargets.length];
        sentencePunctuation[punctKey]={
          text:punctAfter[k],
          home,
          target,
          delay:.06+(punctuationIndex%5)*.09,
          dur:.32+(punctuationIndex%3)*.03
        };
        punctuationIndex++;
        cursor+=cw;
      }
      if(idx<row.length-1) cursor+=gap;
    }
  });

  // Absent words retain their original choreography but their compact endpoint
  // is outside the white field, so they leave instead of being deleted in place.
  const allKeys=[...Object.keys(words),...Object.keys(glyphWords)];
  allKeys.forEach((k,i)=>{
    if(sentenceCenters[k])return;
    const left=i%2===0;
    sentenceCenters[k]=[left?-.12:1.12,.22+(i%5)*.14];
  });
}
function rebuild(){
  for(const [k,s] of Object.entries(glyphWords)) starts[k]=charMetrics(s.text,s.center);
  computeSentenceCenters();
  ensurePunctuationNodes();
}

function lp(g,delay,dur){return clamp((g-delay)/dur);}

function sentenceNodeOpacity(k,mergeT){
  if(k==='CHE_2') return activeSentenceKeys.has(k) ? 1-mergeT : 0;
  return activeSentenceKeys.has(k) ? 1 : mergeT;
}

let animationDirection="open";

function render(g){
  // v31: the editorial regrouping starts earlier and is one continuous,
  // velocity-smooth gesture. No extra snap at the sentence/staging boundary.
  const STAGING=.16;
  const MERGE_END=.34;
  const coreG=clamp((g-STAGING)/(1-STAGING));
  const tMerge=clamp(g/MERGE_END);
  const mergeT=tMerge*tMerge*(3-2*tMerge);

  // Whole-word anchors/moves.
  for(const [k,s] of Object.entries(words)){
    const t=s.mode==="move" ? wordMoveAccent(lp(coreG,s.delay,s.dur)) : 0;
    let x=lerp(s.start[0],s.end[0],t);
    let y=lerp(s.start[1],s.end[1],t);

    const sc=sentenceCenters[k];
    x=lerp(sc[0],x,mergeT);
    y=lerp(sc[1],y,mergeT);

    wordNodes[k].style.transform=`translate(${x*stage.clientWidth}px,${y*stage.clientHeight}px) translate(-50%,-50%)`;
    wordNodes[k].style.opacity=sentenceNodeOpacity(k,mergeT);
  }

  for(const [k,s] of Object.entries(glyphWords)){
    const st=starts[k];
    const p=lp(coreG,s.delay,s.dur);

    glyphNodes[k].forEach((el,i)=>{
      let x=st[i][0], y=st[i][1];

      if(s.mode==="simpleMechanical"){
        const e=mech(p);
        x=lerp(st[i][0],s.targets[i][0],e);
        y=lerp(st[i][1],s.targets[i][1],e);
      }

      if(s.mode==="simpleSmooth"){
        const e=smooth(p);
        x=lerp(st[i][0],s.targets[i][0],e);
        y=lerp(st[i][1],s.targets[i][1],e);
      }

      if(s.mode==="nascono"){
        // 1. compact word moves up/right mechanically
        const moveT=wordMoveAccent(clamp(p/.32));
        const moved=[st[i][0]+.070,st[i][1]-.245];
        const mx=lerp(st[i][0],moved[0],moveT);
        const my=lerp(st[i][1],moved[1],moveT);

        // 2. letters open smoothly to the right
        const openT=smooth(clamp((p-.27)/.73));
        x=lerp(mx,s.final[i][0],openT);
        y=lerp(my,s.final[i][1],openT);
      }

      if(s.mode==="relazioniLUp"){
        const moveT=wordMoveAccent(p);

        // R and E stay fixed.
        if(i===0 || i===1){
          x=st[i][0];
          y=st[i][1];
        }
        // L goes up.
        else if(i===2){
          x=st[i][0];
          y=lerp(st[i][1],rowY[0] - .110, moveT);
        }
        // A Z I O N I go down.
        else if(i>=3){
          x=st[i][0];
          y=lerp(st[i][1],rowY[1],moveT);
        }
      }

      if(s.mode==="immagini"){
        const e=smooth(p);
        const anchor=st[st.length-1]; // final I: fixed
        const fromEnd=(st.length-1)-i;

        // Uniform arithmetic progression:
        // - final I stays fixed
        // - N sits exactly halfway
        // - preceding I lands almost on the left edge
        // - all earlier glyphs continue outside with the SAME spacing
        const leftEdgeI=.018;
        const step=(anchor[0]-leftEdgeI)/2;
        const tx=anchor[0]-(fromEnd*step);

        if(i===st.length-1){
          x=anchor[0];
          y=anchor[1];
        }else{
          x=lerp(st[i][0],tx,e);
          y=st[i][1];
        }
      }

      if(s.mode==="storie"){
        // Translation is crisp/mechanical.
        const moveT=wordMove(clamp(p/.54));
        const targetCenterY=.655;
        y=lerp(st[i][1],targetCenterY,moveT);

        // Tracking opens gently and smoothly around the word center.
        const openT=smooth(clamp((p-.18)/.82));
        const center=.620;
        const expansion=1.20; // subtle ~20% wider
        const tx=center+(st[i][0]-center)*expansion;
        x=lerp(st[i][0],tx,openT);
      }

      if(s.mode==="forme"){
        // Very subtle tracking expansion only.
        const openT=smooth(p);
        const center=.700;
        const expansion=1.75; // requested: final width = 1 + 3/4 of original
        const tx=center + (st[i][0]-center)*expansion;
        x=lerp(st[i][0],tx,openT);
        y=st[i][1];
      }

      if(s.mode==="creano"){
        // CREANO follows the measured geometry of WHAT'S.
        // Each CREANO glyph corresponds to W H A T ' S, left-to-right.

        const firstX=st[0][0];
        const lowY=.880; // one full row below the previous .800 movement line

        const refCompactGap=[0,.0212,.0418,.0620,.0769,.0918];
        const refMax=[-.557, -.315, -.073, .169, .411, .653];
        const refWideRight=[-.047, .186, .419, .652, .885, 1.118];
        const refCompress1=[0,.081,.162,.243,.324,.405];
        const refCompress2=[0,.042,.084,.126,.168,.210];
        const refCompress3=[0,.032,.064,.096,.128,.160];
        const refCompress4=[0,.026,.052,.078,.104,.130];
        const refCompact=[0,.020,.040,.060,.080,.100];

        function arrX(arr,index){
          return firstX + arr[index];
        }

        function between(a,b,t){
          // local phase progression: soft and fluent arrival
          return lerp(a,b,easeOutFluid(clamp(t)));
        }

        if(animationDirection==="open"){
          const q=p;

          if(q < .22){
            const t=easeOutFluid(q/.22);
            x=st[i][0];
            y=lerp(st[i][1],lowY,t);
          }
          else if(q < .40){
            const t=(q-.22)/.18;
            const early=[0,.035,.070,.105,.140,.175];
            x=between(st[i][0],arrX(early,i),t);
            y=lowY;
          }
          else if(q < .76){
            const t=(q-.40)/.36;
            const early=[0,.035,.070,.105,.140,.175];
            x=between(arrX(early,i),arrX(refMax,i),t);
            y=lowY;
          }
          else{
            x=arrX(refMax,i);
            y=lowY;
          }
        }else{
          // v24 — ONLY CREANO'S CLOSING CHANGES.
          // Use the whole global close interval so the horizontal recomposition
          // can breathe at roughly the same pace as NASCONO above.
          const closeT=clamp(1-g);

          if(closeT < .04){
            // v35 — a touch more breathing room before CREANO starts closing.
            x=arrX(refMax,i);
            y=lowY;
          }
          else if(closeT < .20){
            // Same route as v33, but a gentler take-off and slower acceleration.
            const t=kineticCurve((closeT-.04)/.16,.012,.88,.40);
            x=lerp(arrX(refMax,i),arrX(refWideRight,i),t);
            y=lowY;
          }
          else if(closeT < .72){
            // Keep all v33 waypoints; only soften the horizontal compression curve.
            const c=kineticCurve((closeT-.20)/.52,.012,.86,.38);
            const keys=[
              refWideRight,
              refCompress1,
              refCompress2,
              refCompress3,
              refCompress4,
              refCompact
            ];
            const stops=[0,.34,.58,.76,.90,1];
            let seg=0;
            while(seg<stops.length-2 && c>stops[seg+1]) seg++;
            const local=clamp((c-stops[seg])/(stops[seg+1]-stops[seg]));
            x=lerp(arrX(keys[seg],i),arrX(keys[seg+1],i),local);
            y=lowY;
          }
          else{
            // Keep the final return-to-row speed essentially as in v23.
            // CREANO is already compact here; only the block rises.
            const t=kineticCurve((closeT-.72)/.28,.04,.88,.16);
            x=st[i][0];
            y=lerp(lowY,st[i][1],t);
          }
        }
      }

      const sc=sentenceCenters[k];
      const dx=sc[0]-s.center[0];
      const dy=sc[1]-s.center[1];
      const sx=st[i][0]+dx;
      const sy=st[i][1]+dy;
      x=lerp(sx,x,mergeT);
      y=lerp(sy,y,mergeT);

      el.style.transform=`translate(${x*stage.clientWidth}px,${y*stage.clientHeight}px) translate(-50%,-50%)`;
      el.style.opacity=sentenceNodeOpacity(k,mergeT);
    });
  }

  // Punctuation is treated as independent glyphs, not decoration.
  // Each mark leaves the sentence toward a different VISIBLE empty zone and returns
  // with its own stagger, while sharing the same soft departure/arrival family.
  // The targets stay inside the white field, so punctuation remains visible.
  for(const [k,s] of Object.entries(sentencePunctuation)){
    const el=punctNodes[k];
    if(!el) continue;
    const p=lp(g,s.delay,s.dur);
    const e=wordMove(p);
    const x=lerp(s.home[0],s.target[0],e);
    const y=lerp(s.home[1],s.target[1],e);
    el.style.opacity='1';
    el.style.transform=`translate(${x*stage.clientWidth}px,${y*stage.clientHeight}px) translate(-50%,-50%)`;
  }
}

let isOpen=true;
let animating=false;
let armed=false;
let lastPos=null;
let origin=null;
let firstEntered=false;
let phase=0; // open→F→open→L→open→M→open→threshold
let compactSnapshot=new Map();
let openSnapshot=new Map();
let dispersionStarted=false;

rebuild();
render(1);
stage.querySelectorAll('.motion-letter,.glyph,#sentencePunctuation .punct').forEach(el=>{el.style.transition='none';el.style.opacity='0'});
let initialMotionIntroDone=false;
function initialMotionLetterIntro(){
  const units=[...stage.querySelectorAll('.motion-letter,.glyph,#sentencePunctuation .punct')];
  units.forEach(el=>{el.style.transition='none';el.style.opacity='0'});
  void stage.offsetWidth;
  shuffleBridge(units).forEach((el,i)=>{
    const spread=980;
    const delay=Math.floor(Math.random()*spread);
    setTimeout(()=>{
      el.style.transition='opacity 260ms cubic-bezier(.2,.7,.2,1)';
      el.style.opacity='1';
    },delay);
  });
  setTimeout(()=>{initialMotionIntroDone=true},1240);
}
window.__prepareSogliaIntro=()=>{rebuild();render(isOpen?1:0)};
let initialMotionIntroStarted=false;
window.__startSogliaIntro=()=>{
  if(initialMotionIntroStarted)return;
  initialMotionIntroStarted=true;
  initialMotionLetterIntro();
};

const DURATION=1490;
const BASE_SPEED=5;
const BLOCK_SPEED=[6,8,10];
function durationForSpeed(speed){return DURATION*BASE_SPEED/speed;}
function motionSources(){return [...stage.querySelectorAll('.word,.glyph,#sentencePunctuation .punct')];}
function snapshotSources(){
  const sr=stage.getBoundingClientRect();const m=new Map();
  motionSources().forEach(el=>{const r=el.getBoundingClientRect();m.set(el,{cx:r.left-sr.left+r.width/2,cy:r.top-sr.top+r.height/2,left:r.left-sr.left,top:r.top-sr.top,width:r.width,height:r.height});});
  return m;
}
function animate(toOpen,nextPhase){
  if(animating||dispersionStarted)return;
  animationDirection=toOpen?'open':'close';animating=true;armed=false;
  const from=isOpen?1:0,to=toOpen?1:0,t0=performance.now();
  const block=Math.floor(phase/2);
  const dur=durationForSpeed(BLOCK_SPEED[block]||BLOCK_SPEED[BLOCK_SPEED.length-1]);
  function frame(now){
    const r=clamp((now-t0)/dur);render(lerp(from,to,r));
    if(r<1){requestAnimationFrame(frame);return;}
    isOpen=toOpen;phase=nextPhase;animating=false;
    if(phase===1||phase===3||phase===5)compactSnapshot=snapshotSources();
    if(phase===2||phase===4||phase===6)openSnapshot=snapshotSources();
    origin=lastPos?[...lastPos]:null;setTimeout(()=>{armed=true},120);
  }
  requestAnimationFrame(frame);
}
function normalize(vx,vy){const m=Math.hypot(vx,vy)||1;return [vx/m,vy/m];}
function jitter(seed){const x=Math.sin(seed*12.9898+78.233)*43758.5453;return (x-Math.floor(x))-.5;}
function makeExitChar(ch,x,y,style){
  const el=document.createElement('span');el.className='exit-char';el.textContent=ch;
  el.style.fontSize=style.fontSize;el.style.fontWeight=style.fontWeight;el.style.letterSpacing=style.letterSpacing;
  el.style.left=x+'px';el.style.top=y+'px';document.getElementById('dispersionLayer').appendChild(el);return el;
}

function shuffleBridge(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
let slowMenuStarted=false;
function slowFrozenMenuIntro(){
  if(slowMenuStarted)return;
  slowMenuStarted=true;
  const cs=[...document.querySelectorAll('.menu .char')];
  cs.forEach(c=>{
    c.style.transition='none';
    c.style.opacity='0';
    c.style.transform='translateY(7px)';
  });
  void document.body.offsetWidth;
  const order=shuffleBridge(cs);
  order.forEach((c,rank)=>{
    // Recovered 25/08 random-global intro grammar, stretched exactly 2×:
    // 34→68 ms rank spacing; 22→44 ms jitter; 150→300 ms opacity; 190→380 ms settle.
    const delay=rank*68+Math.floor(Math.random()*44);
    setTimeout(()=>{
      c.style.transition='opacity 300ms cubic-bezier(.2,.7,.2,1), transform 380ms cubic-bezier(.2,.7,.2,1)';
      c.style.opacity='1';
      c.style.transform='translateY(0)';
    },delay);
  });
  return Math.max(300,(order.length-1)*68+44+380);
}

function prepareFrozenMenu(){
  const cs=[...document.querySelectorAll('.menu .char')];
  cs.forEach(c=>{c.style.transition='none';c.style.opacity='0';c.style.transform='translateY(7px)'});
}
prepareFrozenMenu();

function disperseToThreshold(){
  if(animating||dispersionStarted||phase!==2)return;
  dispersionStarted=true;armed=false;animating=true;
  const bridge=document.getElementById('motionBridge');
  const layer=document.getElementById('dispersionLayer');
  layer.innerHTML='';
  const sr=stage.getBoundingClientRect();
  const W=stage.clientWidth,H=stage.clientHeight;
  const sources=motionSources();
  const particles=[];
  let n=0;

  sources.forEach(src=>{
    const open=openSnapshot.get(src)||(()=>{
      const r=src.getBoundingClientRect();
      return {cx:r.left-sr.left+r.width/2,cy:r.top-sr.top+r.height/2,left:r.left-sr.left,top:r.top-sr.top,width:r.width,height:r.height};
    })();
    const compact=compactSnapshot.get(src)||{...open};
    const cs=getComputedStyle(src);
    const text=src.textContent||'';
    const whole=src.classList.contains('word')&&text.length>1;
    const count=whole?text.length:1;

    for(let i=0;i<count;i++){
      const ch=whole?text[i]:text;
      if(!ch)continue;
      const fx=(i+.5)/count;
      const x=whole?open.left+open.width*fx:open.cx;
      const y=open.cy;
      const cx=whole?compact.left+compact.width*fx:compact.cx;
      const cy=compact.cy;

      let vx=x-cx,vy=y-cy;
      if(Math.hypot(vx,vy)<12){
        vx=x-W/2;vy=y-H/2;
        if(Math.hypot(vx,vy)<12){const a=(n%8)/8*Math.PI*2;vx=Math.cos(a);vy=Math.sin(a)}
      }
      const [nx,ny]=normalize(vx,vy);

      // Straight ray intersection with the WHITE field. Black bands are a hard visual limit.
      const hits=[];
      if(nx>1e-5) hits.push((W-x)/nx); else if(nx<-1e-5) hits.push((0-x)/nx);
      if(ny>1e-5) hits.push((H-y)/ny); else if(ny<-1e-5) hits.push((0-y)/ny);
      const d=Math.min(...hits.filter(v=>Number.isFinite(v)&&v>0));
      const overshoot=Math.max(18,parseFloat(cs.fontSize)||24); // clipped by #motionBridge
      const tx=x+nx*(d+overshoot),ty=y+ny*(d+overshoot);
      const distance=Math.hypot(tx-x,ty-y);

      const el=makeExitChar(ch,x,y,cs);
      // Same v37 straight-star behavior, ~25% slower and with a little more temporal spread.
      const delay=((n*37)%195);                // 0–194 ms
      const speed=1.75+((n*19)%70)/100;        // 1.75–2.44 px/ms
      const duration=Math.max(220,Math.min(680,distance/speed));
      particles.push({el,x,y,tx,ty,delay,duration});
      n++;
    }
    src.style.opacity='0';
  });

  const t0=performance.now();
  const exitTotal=Math.max(...particles.map(p=>p.delay+p.duration),560);
  const calmPause=500;
  const menuStartAt=exitTotal+calmPause;
  let menuStarted=false;
  let menuDuration=0;
  let exitCleared=false;
  let finished=false;

  function frame(now){
    const elapsed=now-t0;
    particles.forEach(p=>{
      const t=clamp((elapsed-p.delay)/p.duration);
      // Keep the star-like directness: very short launch ramp, then nearly linear straight travel.
      const e=t<.07 ? (t/.07)*(t/.07)*.07 : t;
      p.el.style.transform=`translate(${(p.tx-p.x)*e}px,${(p.ty-p.y)*e}px) translate(-50%,-50%)`;
    });

    // Once the outgoing phrase is fully gone, reveal the untouched frozen Soglia
    // but leave its menu invisible for a full calm pause.
    if(!exitCleared&&elapsed>=exitTotal){
      exitCleared=true;
      layer.innerHTML='';
      stage.style.display='none';
      bridge.classList.add('reveal-frozen');
      bridge.style.background='transparent';
      window.__startSogliaBorder?.();
    }

    if(!menuStarted&&elapsed>=menuStartAt){
      menuStarted=true;
      menuDuration=slowFrozenMenuIntro()||0;
    }

    const doneAt=menuStartAt+(menuDuration||0)+80;
    if(menuStarted&&elapsed>=doneAt&&!finished){
      finished=true;
      phase=7;animating=false;
      bridge.style.display='none';
      bridge.style.pointerEvents='none';
      document.body.classList.remove('bridge-pre');
      window.__resetEraseCursorForThreshold?.();
      return;
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function prepareNextSentence(){
  sentenceVariantIndex=(sentenceVariantIndex+1)%SENTENCE_ORDER.length;
  sentenceVariant=SENTENCE_ORDER[sentenceVariantIndex];
  rebuild();
  render(1);
}
function advance(){
  if(!initialMotionIntroDone||animating||!armed||dispersionStarted)return;
  if(phase===2&&!window.__frozenSogliaReady){window.__pendingSogliaThreshold=true;return;}
  armed=false;
  if(phase===0){prepareNextSentence();animate(false,1)}
  else if(phase===1)animate(true,2);
  else if(phase===2)disperseToThreshold();
}
window.__resumeSogliaThreshold=()=>{
  if(window.__pendingSogliaThreshold){window.__pendingSogliaThreshold=false;advance();}
};
const arm=e=>{lastPos=[e.clientX,e.clientY];origin=[e.clientX,e.clientY];if(initialMotionIntroDone&&!animating&&!dispersionStarted)armed=true};
stage.addEventListener('pointerenter',e=>{if(!firstEntered){firstEntered=true;arm(e)}else if(!animating&&!armed&&!dispersionStarted)arm(e)});
stage.addEventListener('pointermove',e=>{lastPos=[e.clientX,e.clientY];if(!initialMotionIntroDone||animating||!armed||dispersionStarted)return;if(!origin){origin=[e.clientX,e.clientY];return}if(Math.hypot(e.clientX-origin[0],e.clientY-origin[1])>=12)advance()},{passive:true});
stage.addEventListener('click',()=>{if(initialMotionIntroDone&&!animating&&!dispersionStarted){if(!armed)armed=true;advance()}});
addEventListener('keydown',e=>{if(initialMotionIntroDone&&(e.code==='Space'||e.code==='Enter')&&!animating&&!dispersionStarted){e.preventDefault();if(!armed)armed=true;advance()}});
addEventListener('resize',()=>{if(dispersionStarted)return;rebuild();render(isOpen?1:0);origin=null;if(phase===1||phase===3||phase===5)compactSnapshot=snapshotSources();if(phase===2||phase===4||phase===6)openSnapshot=snapshotSources();});
})();
