<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Il Suono Organizzato — Soglia v62 — Logo Serif Font Candidate</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:14px/1.4 system-ui,sans-serif;letter-spacing:.04em}
</style>
</head>
<body>
<div id="loading">Caricamento Soglia v62…</div>
<script>
(async()=>{
  const frozenUrl = "https://raw.githubusercontent.com/wshwlmLab/iso-website-previews/0dd2b7d3b9e65ba34894182c808c7074175f4d6d/Il-Suono-Organizzato-Soglia-v62-FROZEN-2026-09-10.html";
  try{
    const r = await fetch(frozenUrl,{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    let html = await r.text();

    const fontPatch = `
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style id="logo-serif-font-test">
html,body,.stage,.paper,
.identity,.identity-inner,.micro,.micro *,
.menu,.word,.word-inner,.char,.char-flip,
#motionStage .word,#motionStage .glyph,
#sentencePunctuation .punct,
#dispersionLayer .exit-char,
.snake,.snake *{
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif !important;
}
</style>`;

    html = html.replace("</head>", fontPatch + "\n</head>");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById("loading").textContent = "Errore nel caricamento della baseline v62: " + err.message;
  }
})();
</script>
</body>
</html>
