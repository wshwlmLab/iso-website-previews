    :root {

    .meter-hit { z-index: 5; display: none; border: 0; border-radius: 0; padding: 0; background: transparent; cursor: pointer; }

    .meter.pixel-enter { animation: meterFadeIn 2.9s cubic-bezier(.2,.7,.25,1) both; }
    .meter.pixel-enter .meter-seg {

      animation: meterPixelIn 2.55s cubic-bezier(.18,.72,.2,1) both;
      animation-delay: var(--pixel-delay, 0ms);
      transform-origin: center;
    }
    .meter.pixel-enter .meter-seg::after {
      content: ''; position: absolute; left: 50%; top: 50%; width: 1px; height: 5px;
      background: currentColor; transform: translate(-50%, -50%);
      animation: meterPixelVertical 2.55s ease both;
      animation-delay: var(--pixel-delay, 0ms);
    }
    @keyframes meterFadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes meterPixelIn {
      0% { transform: translate(var(--pixel-x), var(--pixel-y)) scale(.18); }
      62% { transform: translate(0, 0) scale(.82); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes meterPixelVertical {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
      45% { opacity: 1; }

    .meter-zone {

  <script>
    (() => {
      const stage = document.querySelector('.stage');
      const advanceButton = document.querySelector('.advance');
      const prompt = document.querySelector('.audio-label');
      const meter = document.querySelector('.meter');
      const meterHit = document.querySelector('.meter-hit');
      const meterZone = meter.querySelector('.meter-zone');
      const meterCols = Array.from({ length: 5 }, () => {
        const col = document.createElement('span');
        col.className = 'meter-col';
        for (let index = 0; index < 16; index++) {
          const segment = document.createElement('i');
          segment.className = 'meter-seg';
          col.appendChild(segment);
        }
        meterZone.appendChild(col);
        return col;
      });
      let meterPaused = false, meterFrame = null;
      let meterMaster = .28, meterPulse = 0, meterNextEvent = performance.now(), meterPrevious = performance.now();
      const meterValues = [.31, .42, .36, .28, .24];
      const meterTargets = meterValues.slice();
      const meterWeights = [.88, 1.12, .96, .78, .68];
      const meterDrift = new Float32Array(5);
      const groups = [['.title'], ['.food'], ['.truck'], ['.price'], ['.tribal-left', '.tribal-right']]
        .map(group => group.map(selector => document.querySelector(selector)));
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const effect = new URLSearchParams(location.search).get('effect') || 'halftone-deeper-darks-meter-alive';
      const compositeBlueMode = effect === 'halftone-ultra-blue-composite';
      const ultraBWMode = effect === 'halftone-ultra-bw';
      const livingPixelsMode = effect === 'halftone-deeper-darks-meter-alive';
      const meterPixelMode = effect === 'halftone-deeper-darks-meter' || livingPixelsMode;
      const deeperDarksMode = effect === 'halftone-deeper-darks' || meterPixelMode;
      const halftoneMode = effect === 'halftone' || effect === 'halftone-contrast-blue' || compositeBlueMode || ultraBWMode || deeperDarksMode;
      const contrastBlueMode = effect === 'halftone-contrast-blue' || compositeBlueMode;
      const pinkFinalMode = livingPixelsMode;
      let step = 0, locked = false;
      const totalSteps = groups.length + ((contrastBlueMode || pinkFinalMode) ? 1 : 0);

      function meterEvent(now) {
        const accent = Math.random() < .22;
        const quiet = Math.random() < .19;
        meterPulse = quiet ? .08 + Math.random() * .14 : accent ? .68 + Math.random() * .28 : .28 + Math.random() * .42;
        meterMaster = Math.max(.13, Math.min(.98, meterMaster * .34 + meterPulse * .82));
        meterCols.forEach((col, ci) => {
          meterDrift[ci] = meterDrift[ci] * .32 + (Math.random() - .5) * .20;
          const neighbourShape = 1 - Math.abs(ci - 1.4) * .055;
          meterTargets[ci] = Math.max(.10, Math.min(.98, meterMaster * meterWeights[ci] * neighbourShape + meterDrift[ci] + .045 * Math.random()));
        });
        meterNextEvent = now + 68 + Math.random() * 118 + (quiet ? Math.random() * 100 : 0);
      }
      function meterDraw(now) {
        const dt = Math.min(40, now - meterPrevious);
        meterPrevious = now;
        if (!meterPaused && now >= meterNextEvent) meterEvent(now);
        meterCols.forEach((col, ci) => {
          if (!meterPaused) {
            const delta = meterTargets[ci] - meterValues[ci];
            const rate = delta > 0 ? .038 : .0105;
            meterValues[ci] += delta * (1 - Math.exp(-rate * dt));
            meterTargets[ci] = Math.max(.09, meterTargets[ci] - dt * (.00013 + ci * .000007));
          }
          const exact = meterValues[ci] * 16;
          Array.from(col.children).forEach((seg, index) => {
            const distance = exact - index;
            seg.style.opacity = distance >= 1 ? '.98' : distance > .03 ? '.48' : '.075';
            seg.style.transform = distance > .03 ? 'scaleY(1)' : 'scaleY(.72)';
          });
        });
        meterFrame = requestAnimationFrame(meterDraw);
      }
      function startMeter() {
        if (meterFrame) return;
        meterPrevious = performance.now();
        meterNextEvent = meterPrevious;
        meterFrame = requestAnimationFrame(meterDraw);
      }
      function stopMeter() {
        if (meterFrame) { cancelAnimationFrame(meterFrame); meterFrame = null; }
      }
      function activateMeter() {
        const rect = prompt.getBoundingClientRect();
        const meterWidth = rect.height * 1.18;
        meter.style.width = meterWidth + 'px';
        meter.style.height = rect.height + 'px';
        meterHit.style.width = meterWidth + 'px';
        meterHit.style.height = rect.height + 'px';
        const diagonal = Math.sqrt(meterWidth * meterWidth + rect.height * rect.height) * .82;
        const angle = -Math.atan2(rect.height, meterWidth) * (180 / Math.PI);
        meter.style.setProperty('--diag-len', diagonal + 'px');
        meter.style.setProperty('--diag-angle', angle + 'deg');
        prompt.classList.add('is-hidden');
        meter.classList.add('active');
        meterHit.classList.add('active');
        meter.querySelectorAll('.meter-seg').forEach(seg => {
          seg.style.setProperty('--pixel-delay', `${Math.round(Math.random() * 620)}ms`);
          seg.style.setProperty('--pixel-x', `${((Math.random() - .5) * 13).toFixed(1)}px`);
          seg.style.setProperty('--pixel-y', `${((Math.random() - .5) * 9).toFixed(1)}px`);
        });
        meter.classList.add('pixel-enter');
        startMeter();
        setTimeout(() => meter.classList.remove('pixel-enter'), reduced ? 0 : 3250);
      }

      const shuffle = list => {
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
      };

      function keepPixelsAlive(canvas, ctx, cells, pitch, sourcePerCss) {
        const living = cells.map(c => ({
          ...c,
          phase: Math.random() * Math.PI * 2,
          speed: .0012 + Math.random() * .0018,
          amplitude: (.55 + Math.random() * 1.35) * sourcePerCss,
          breathe: .045 + Math.random() * .065
        }));
        if (!living.length) return;
        let lastPaint = 0;
        let motionStarted;
        let previousTime;
        let motionTime = 0;
        let speedScale = 1;

        function plusPath(target, x, y, size) {
          const arm = size * .56;
          target.beginPath();
          target.moveTo(x - arm, y);
          target.lineTo(x + arm, y);
          target.moveTo(x, y - arm);
          target.lineTo(x, y + arm);
          target.stroke();
        }

        function idle(time) {
          requestAnimationFrame(idle);
          if (document.hidden || time - lastPaint < 72) return;
          motionStarted ??= time;
          lastPaint = time;
          const elapsed = time - motionStarted;
          const frameDelta = previousTime == null ? 0 : Math.min(120, time - previousTime);
          previousTime = time;
          const targetSpeed = stage.classList.contains('pink-final') ? .12 : 1;
          const speedEase = 1 - Math.exp(-frameDelta / 1050);
          speedScale += (targetSpeed - speedScale) * speedEase;
          motionTime += frameDelta * speedScale;
          const entrance = Math.min(1, elapsed / 1650);
          const motionBlend = entrance * entrance * (3 - 2 * entrance);
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (const c of living) {
            const size = c.lastSize || c.toneSize;
            const lineWidth = c.lastLineWidth || Math.max(.38 * sourcePerCss, size * .16);
            const phase = c.phase + motionTime * c.speed;
            const originX = c.lastX ?? c.x;
            const originY = c.lastY ?? c.y;
            const dx = originX + Math.sin(phase) * c.amplitude * motionBlend;
            const dy = originY + Math.cos(phase * .83) * c.amplitude * .72 * motionBlend;
            const breathing = size * (1 + Math.sin(phase * .71) * c.breathe * motionBlend);

            ctx.strokeStyle = c.lastColor || `rgb(${c.gray} ${c.gray} ${c.gray})`;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'square';
            const originAlpha = c.lastAlpha ?? 1;
            ctx.globalAlpha = originAlpha + (1 - originAlpha) * motionBlend;
            plusPath(ctx, dx, dy, breathing);
          }
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(idle);
      }

      function reveal(image, duration = 3100) {
        if (reduced) {
          image.classList.add('is-visible');
          return Promise.resolve();
        }
        return new Promise(resolve => {
          const canvas = document.createElement('canvas');
          canvas.className = `${image.className} pixel-canvas`;
          canvas.setAttribute('aria-hidden', 'true');
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          image.after(canvas);
          const ctx = canvas.getContext('2d', { alpha: true });
          if (!ctx) { canvas.remove(); image.classList.add('is-visible'); resolve(); return; }
          const photoMode = image.classList.contains('truck');

          const renderedWidth = Math.max(1, image.getBoundingClientRect().width);
          const sourcePerCss = image.naturalWidth / renderedWidth;
          const pitch = Math.max(2, (halftoneMode ? 3.05 : 3.2) * sourcePerCss);
          const sample = document.createElement('canvas');
          sample.width = image.naturalWidth;
          sample.height = image.naturalHeight;
          const sampleCtx = sample.getContext('2d', { willReadFrequently: true });
          sampleCtx.drawImage(image, 0, 0);
          const pixels = sampleCtx.getImageData(0, 0, sample.width, sample.height).data;
          const cells = [];

          for (let y = pitch * .5; y < canvas.height; y += pitch) {
            for (let x = pitch * .5; x < canvas.width; x += pitch) {
              const sx = Math.min(canvas.width - 1, Math.round(x));
              const sy = Math.min(canvas.height - 1, Math.round(y));
              const index = (sy * canvas.width + sx) * 4;
              const alpha = pixels[index + 3] / 255;
              if (alpha < .02) continue;
              const r = pixels[index], g = pixels[index + 1], b = pixels[index + 2];
              const sourceGray = Math.round(r * .2126 + g * .7152 + b * .0722);
              const contrastAmount = (compositeBlueMode || ultraBWMode) ? 4 : 2;
              let gray = contrastBlueMode
                ? Math.max(0, Math.min(255, Math.round((sourceGray - 128) * contrastAmount + 128)))
                : sourceGray;
              // Selective dark-tone curve: values at/above the knee remain exactly
              // unchanged, while existing shadows deepen progressively toward black.
              if (deeperDarksMode && sourceGray < 155) {
                gray = Math.round(155 * Math.pow(sourceGray / 155, 1.6));
              }
              const light = gray / 255;
              const diagonal = (x + y * .73) / (canvas.width + canvas.height * .73);
              const waves = Math.sin(x / (pitch * 6.5)) * .075 + Math.sin(y / (pitch * 9)) * .055;
              const activation = Math.max(0, Math.min(1, diagonal + waves + (Math.random() - .5) * .32));
              const variation = halftoneMode
                ? .82 + (Math.random() - .5) * .34
                : .16 + Math.pow(Math.random(), .68) * 1.52;
              const halftoneTone = photoMode
                ? Math.pow(1 - light, .72)
                : Math.pow(alpha * (1 - light * .35), .68);
              const toneSize = halftoneMode
                ? pitch * Math.min(1.34, Math.max(.08, (.05 + halftoneTone * 1.18) * variation))
                : pitch * Math.min(1.42, (.26 + (1 - light) * .66) * Math.sqrt(alpha) * variation);
              const angle = Math.random() * Math.PI * 2;
              const travel = pitch * (.2 + Math.random() * 2.7);
              cells.push({
                x, y, r, g, b, gray, alpha, activation, toneSize,
                fromX: Math.cos(angle) * travel,
                fromY: Math.sin(angle) * travel,
                wobble: .25 + Math.random() * 1.9,
                sliceScale: .2 + Math.random() * .18,
                seed: Math.random() * Math.PI * 2
              });
            }
          }
          cells.sort((a, b) => a.activation - b.activation);
          image.style.opacity = '0';

          let started;
          function frame(time) {
            started ??= time;
            const p = Math.min(1, (time - started) / duration);
            const front = p * 1.38 - .16;
            const fusion = halftoneMode ? 0 : Math.max(0, Math.min(1, (p - .68) / .32));
            const organicFill = fusion * fusion * (3 - 2 * fusion);
            image.style.opacity = String(organicFill);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const sliceA = (p * 1.55) % 1.35 - .16;
            const sliceB = (p * 1.18 + .46) % 1.4 - .2;
            const colorFront = p * 1.45 - .18;

            for (const c of cells) {
              const local = (front - c.activation) / (.11 + c.wobble * .028);
              if (local <= 0) break;
              const born = Math.min(1, local);
              const settle = born * born * (3 - 2 * born);
              const driftFade = (1 - settle) * (1 - organicFill);
              const yNorm = c.y / canvas.height;
              const bandA = Math.max(0, 1 - Math.abs(yNorm - sliceA) / .115);
              const bandB = Math.max(0, 1 - Math.abs(yNorm - sliceB) / .075);
              const slice = Math.max(bandA, bandB * .78);
              const sliceDirection = Math.sin(c.seed + Math.floor(c.y / (pitch * 4)) * 1.7);
              const horizontalSlice = photoMode
                ? sliceDirection * pitch * (1.2 + c.wobble) * slice * (1 - organicFill)
                : 0;
              const tremble = Math.sin(p * (13 + c.wobble * 8) + c.seed) * pitch * .18 * driftFade;
              const dx = c.x + c.fromX * driftFade + tremble + horizontalSlice;
              const dy = c.y + c.fromY * driftFade + Math.cos(p * 17 + c.seed) * pitch * .13 * driftFade;
              const pulse = .52 + .48 * Math.sin(c.seed + p * (9 + c.wobble * 6));
              let size = c.toneSize * (.13 + .87 * settle) * (.72 + pulse * .48);
              if (photoMode) size *= 1 + slice * c.sliceScale;
              size += (pitch * (1.01 + Math.sin(c.seed) * .06) - size) * organicFill;
              if (size < .25) continue;

              const colorMix = halftoneMode ? 0 : photoMode
                ? Math.max(0, Math.min(1, (colorFront - yNorm) / .17 + .5 + slice * .42))
                : 1;
              const rr = Math.round(c.gray + (c.r - c.gray) * colorMix);
              const gg = Math.round(c.gray + (c.g - c.gray) * colorMix);
              const bb = Math.round(c.gray + (c.b - c.gray) * colorMix);
              ctx.globalAlpha = Math.min(1, (halftoneMode ? 1 : c.alpha) * (.16 + settle * .84) * (1 - organicFill));
              c.lastAlpha = ctx.globalAlpha;
              const color = `rgb(${rr} ${gg} ${bb})`;
              const arm = size * .56;
              ctx.strokeStyle = color;
              ctx.lineWidth = Math.max(.38 * sourcePerCss, size * .16);
              c.lastSize = size;
              c.lastLineWidth = ctx.lineWidth;
              c.lastColor = color;
              c.lastX = dx;
              c.lastY = dy;
              ctx.lineCap = 'square';
              ctx.beginPath();
              ctx.moveTo(dx - arm, dy);
              ctx.lineTo(dx + arm, dy);
              ctx.moveTo(dx, dy - arm);
              ctx.lineTo(dx, dy + arm);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;

            if (p < 1) requestAnimationFrame(frame);
            else {
              if (halftoneMode) {
                image.style.opacity = '0';
                canvas.dataset.finalHalftone = 'true';
                if (livingPixelsMode) keepPixelsAlive(canvas, ctx, cells, pitch, sourcePerCss);
              } else {
                image.style.opacity = '1';
                image.classList.add('is-visible');
                requestAnimationFrame(() => canvas.remove());
              }
              resolve();
            }
          }
          requestAnimationFrame(frame);
        });
      }

      const ready = Promise.all(groups.flat().map(img => img.decode().catch(() => {
        if (!img.complete) throw new Error(`Asset non caricato: ${img.src}`);
      })));

      function revealBluePage(duration = 2200) {
        if (compositeBlueMode) return revealBlueComposite(duration);
        return new Promise(resolve => {
          const canvas = document.createElement('canvas');
          canvas.className = 'page-halftone';
          canvas.width = Math.max(1, Math.round(innerWidth * devicePixelRatio));
          canvas.height = Math.max(1, Math.round(innerHeight * devicePixelRatio));
          stage.append(canvas);
          const ctx = canvas.getContext('2d');
          const pitch = Math.max(5, 4.2 * devicePixelRatio);
          const cells = [];
          for (let y = pitch * .5; y < canvas.height; y += pitch) {
            for (let x = pitch * .5; x < canvas.width; x += pitch) {
              const wave = Math.sin(x / (pitch * 11)) * .08 + Math.sin(y / (pitch * 8)) * .06;
              const activation = (x + y * .68) / (canvas.width + canvas.height * .68) + wave + (Math.random() - .5) * .24;
              cells.push({
                x, y, activation,
                size: pitch * (.12 + Math.pow(Math.random(), .72) * .54),
                seed: Math.random() * Math.PI * 2
              });
            }
          }
          cells.sort((a, b) => a.activation - b.activation);
          stage.classList.add('blue-final');
          canvas.style.opacity = '1';
          let started;
          function frame(time) {
            started ??= time;
            const p = Math.min(1, (time - started) / duration);
            const front = p * 1.34 - .12;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(37,158,232,.48)';
            ctx.lineCap = 'square';
            for (const c of cells) {
              const local = (front - c.activation) / .12;
              if (local <= 0) break;
              const born = Math.min(1, local);
              const settle = born * born * (3 - 2 * born);
              const pulse = .9 + Math.sin(c.seed + p * 10) * .1 * (1 - settle);
              const arm = c.size * settle * pulse;
              if (arm < .25) continue;
              ctx.lineWidth = Math.max(.7 * devicePixelRatio, arm * .22);
              ctx.beginPath();
              ctx.moveTo(c.x - arm, c.y); ctx.lineTo(c.x + arm, c.y);
              ctx.moveTo(c.x, c.y - arm); ctx.lineTo(c.x, c.y + arm);
              ctx.stroke();
            }
            if (p < 1) requestAnimationFrame(frame);
            else resolve();
          }
          requestAnimationFrame(frame);
        });
      }

      function revealBlueComposite(duration = 2400) {
        return new Promise(resolve => {
          const scale = Math.min(devicePixelRatio || 1, 1.5);
          const canvas = document.createElement('canvas');
          canvas.className = 'page-halftone';
          canvas.width = Math.max(1, Math.round(innerWidth * scale));
          canvas.height = Math.max(1, Math.round(innerHeight * scale));
          stage.append(canvas);
          const ctx = canvas.getContext('2d');
          const sample = document.createElement('canvas');
          sample.width = canvas.width;
          sample.height = canvas.height;
          const sampleCtx = sample.getContext('2d', { willReadFrequently: true });

          sampleCtx.fillStyle = '#f7f7f4';
          sampleCtx.fillRect(0, 0, sample.width, sample.height);

          const plastic = document.querySelector('.plastic-base');
          const sourceRatio = plastic.naturalWidth / plastic.naturalHeight;
          const targetRatio = sample.width / sample.height;
          let drawW, drawH, drawX, drawY;
          if (sourceRatio > targetRatio) {
            drawH = sample.height;
            drawW = drawH * sourceRatio;
            drawX = (sample.width - drawW) / 2;
            drawY = 0;
          } else {
            drawW = sample.width;
            drawH = drawW / sourceRatio;
            drawX = 0;
            drawY = (sample.height - drawH) / 2;
          }
          sampleCtx.globalAlpha = .48;
          sampleCtx.drawImage(plastic, drawX, drawY, drawW, drawH);
          sampleCtx.globalAlpha = 1;

          groups.flat().forEach(image => {
            const rect = image.getBoundingClientRect();
            sampleCtx.drawImage(
              image,
              rect.left * scale,
              rect.top * scale,
              rect.width * scale,
              rect.height * scale
            );
          });

          const pixels = sampleCtx.getImageData(0, 0, sample.width, sample.height).data;
          const pitch = Math.max(4.8, 3.6 * scale);
          const cells = [];
          for (let y = pitch * .5; y < canvas.height; y += pitch) {
            for (let x = pitch * .5; x < canvas.width; x += pitch) {
              const sx = Math.min(canvas.width - 1, Math.round(x));
              const sy = Math.min(canvas.height - 1, Math.round(y));
              const index = (sy * canvas.width + sx) * 4;
              const sourceGray = pixels[index] * .2126 + pixels[index + 1] * .7152 + pixels[index + 2] * .0722;
              const gray = Math.max(0, Math.min(255, (sourceGray - 128) * 4 + 128));
              const darkness = 1 - gray / 255;
              const wave = Math.sin(x / (pitch * 12)) * .055 + Math.sin(y / (pitch * 9)) * .04;
              cells.push({
                x, y,
                activation: (x + y * .7) / (canvas.width + canvas.height * .7) + wave + (Math.random() - .5) * .2,
                size: pitch * Math.min(1.28, .045 + Math.pow(darkness, .66) * 1.14) * (.88 + Math.random() * .24),
                seed: Math.random() * Math.PI * 2
              });
            }
          }
          cells.sort((a, b) => a.activation - b.activation);
          stage.classList.add('blue-final', 'blue-composite-final');
          let started;
          function frame(time) {
            started ??= time;
            const p = Math.min(1, (time - started) / duration);
            const smooth = p * p * (3 - 2 * p);
            const front = p * 1.34 - .12;
            canvas.style.opacity = String(Math.min(1, smooth * 1.18));
            ctx.fillStyle = '#edf8ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#168fd2';
            ctx.lineCap = 'square';
            for (const c of cells) {
              const local = (front - c.activation) / .105;
              if (local <= 0) break;
              const born = Math.min(1, local);
              const settle = born * born * (3 - 2 * born);
              const pulse = .94 + Math.sin(c.seed + p * 9) * .06 * (1 - settle);
              const arm = c.size * settle * pulse;
              if (arm < .22) continue;
              ctx.lineWidth = Math.max(.68 * scale, arm * .2);
              ctx.beginPath();
              ctx.moveTo(c.x - arm, c.y); ctx.lineTo(c.x + arm, c.y);
              ctx.moveTo(c.x, c.y - arm); ctx.lineTo(c.x, c.y + arm);
              ctx.stroke();
            }
            if (p < 1) requestAnimationFrame(frame);
            else resolve();
          }
          requestAnimationFrame(frame);
        });
      }

      async function advance() {
        if (locked || step >= totalSteps) return;
        locked = true;
        try {
          await ready;
          stage.classList.remove('is-start');
          if (contrastBlueMode && step === groups.length) {
            step++;
            await revealBluePage();
            advanceButton.disabled = true;
            return;
          }
          if (pinkFinalMode && step === groups.length) {
            step++;
            stage.classList.add('pink-final');
            await new Promise(resolve => setTimeout(resolve, reduced ? 0 : 2600));
            advanceButton.disabled = true;
            return;
          }
          const current = step++;
          await Promise.all(groups[current].map(img => reveal(img, 3100)));
          advanceButton.disabled = step >= totalSteps;
        } catch (error) {
          console.error('Unable to reveal assets', error);
        } finally { locked = false; }
      }

      prompt.addEventListener('click', event => {
        event.stopPropagation();
        activateMeter();
        advance();
      });
      meterHit.addEventListener('click', event => {
        event.stopPropagation();
        meterPaused = !meterPaused;
        meter.classList.toggle('paused', meterPaused);
        meterHit.setAttribute('aria-pressed', String(meterPaused));
        meterHit.setAttribute('aria-label', meterPaused ? 'Riavvia il meter' : 'Ferma il meter');
        if (meterPaused) stopMeter(); else startMeter();
      });
      advanceButton.addEventListener('click', () => { if (step > 0) advance(); });

      if (new URLSearchParams(location.search).get('state') === 'final') {
        ready.then(() => {
          step = groups.length;
          groups.flat().forEach(img => img.classList.add('is-visible'));
          stage.classList.remove('is-start');
          activateMeter();
          advanceButton.disabled = true;
        }).catch(console.error);
      }
    })();
  </script>
</body>
</html>
