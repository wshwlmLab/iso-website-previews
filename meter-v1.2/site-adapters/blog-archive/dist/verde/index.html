<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Gumleaf — Tre verdi — Il Suono Organizzato</title><style>:root{
  --frame-top:6.52vh;
  --frame-side:2vw;
  --menu-size:clamp(54px,7vw,112px);
  --identity-size:clamp(19px,2.25vw,36px);
  --micro-size:clamp(8px,.708vw,11px);
  --psyop-tracking:.055em;
}
.identity{position:absolute;z-index:5;font-size:var(--identity-size);line-height:1;letter-spacing:var(--psyop-tracking);white-space:nowrap;user-select:none;cursor:default;transition:none}
.id-il{left:.65vw;top:calc(var(--frame-top)/2);transform:translateY(-50%)}
.id-suono{right:.72vw;top:calc(var(--frame-top)/2);transform:translateY(-50%)}
.id-organizzato{right:.70vw;bottom:calc(var(--frame-top)/2);transform:translateY(50%)}
.identity-inner{display:block;line-height:1;transform-origin:50% var(--optical-axis-y,50%);transform:scaleY(-1);will-change:transform;pointer-events:none}
.identity.identity-flipped .identity-inner{transform:scaleY(1)}
.micro{position:absolute;left:.65vw;bottom:calc(var(--frame-top)/2);transform:translateY(50%);font-size:var(--micro-size);display:flex;width:25vw;justify-content:space-between;gap:0;white-space:nowrap}
.micro .clock-group{display:inline-flex;align-items:baseline;gap:.55em}
.micro .tz{color:#777;font-size:.92em}    .meter, .meter-hit {
      position: fixed;
      z-index: 50;
      left: 50%;
      top: calc(6.52vh / 2);
      width: clamp(52px, 4.2vw, 62px);
      height: clamp(32px, 2.85vw, 41px);
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .meter {
      border: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
      opacity: 1;
    }
    .meter-hit {
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }
    .meter-hit.active { pointer-events: auto; }
    .meter-zone {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 50%;
      height: 80%;
      padding: 1px 0;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: clamp(4px, .35vw, 6px);
    }
    .meter-col {
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column-reverse;
      justify-content: space-between;
      align-items: stretch;
      gap: 0;
    }
    .meter-seg {
      position: relative;
      width: 100%;
      min-height: 0;
      flex: 0 0 1px;
      background: #343434;
      opacity: 1;
      border-radius: 0;
      transform: scaleY(1);
      transform-origin: center;
      transition: background 56ms linear, opacity 56ms linear, transform 72ms cubic-bezier(.2,.8,.2,1);
    }
    .meter::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 82%;
      height: 2px;
      background: #f1f1f1;
      transform: translate(-50%, -50%) rotate(-40deg) scaleX(0);
      transform-origin: center;
      transition: transform .18s ease;
    }
    .meter.paused::after { transform: translate(-50%, -50%) rotate(-40deg) scaleX(1); }
    .meter.paused .meter-seg { background: #343434 !important; opacity: 1 !important; transform: scaleY(1) !important; }

<main class="page-window"><div class="palette"><header class="heading"><h1>GUMLEAF / TRE VERDI</h1><a href="../">ARCHIVIO</a></header><div class="specimens"><section class="specimen" style="--green:#49A52E" aria-label="Verde A, Più luminoso"><div class="label"><span>A</span><span>PIÙ LUMINOSO</span></div><p class="number">02</p><h2 class="word">GUMLEAF</h2><div class="band"></div><p class="hex">#49A52E</p></section><section class="specimen" style="--green:#27913C" aria-label="Verde B, Verde foglia"><div class="label"><span>B</span><span>VERDE FOGLIA</span></div><p class="number">02</p><h2 class="word">GUMLEAF</h2><div class="band"></div><p class="hex">#27913C</p></section><section class="specimen" style="--green:#087F45" aria-label="Verde C, Più profondo"><div class="label"><span>C</span><span>PIÙ PROFONDO</span></div><p class="number">02</p><h2 class="word">GUMLEAF</h2><div class="band"></div><p class="hex">#087F45</p></section></div><footer class="current">VERDE ATTUALE <span>02 / GUMLEAF</span> #72B94B</footer></div></main></div><script src="../iso-meter-response.js?v=20261003-meter12"></script><script>const identities=[...document.querySelectorAll('.identity')];
identities.forEach(el=>{
  let inside=false;
  let flipped=false;
  el.addEventListener('pointerenter',()=>{
    if(inside) return;
    inside=true;
    flipped=!flipped;
    el.classList.toggle('identity-flipped',flipped);
  });
  el.addEventListener('pointerleave',()=>{
    inside=false;
  });
});

// ---------- optical flip axis ----------
// scaleY(-1) around the CSS line-box center can look like a vertical jump,
// because the font's real uppercase ink is not vertically centered inside
// that line box. Measure the actual glyph ink and rotate around its optical
// centre instead, so the visible top/bottom margins stay fixed in both states.
function setOpticalFlipAxes(){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const targets=[...document.querySelectorAll('.word-inner,.identity-inner,.char-flip')];

  targets.forEach(el=>{
    const parent=el.parentElement;
    const cs=getComputedStyle(parent);
    const fs=parseFloat(cs.fontSize)||16;
    const lhRaw=parseFloat(cs.lineHeight);
    const lh=Number.isFinite(lhRaw)?lhRaw:fs;
    const weight=cs.fontWeight||'400';
    const family=cs.fontFamily||'monospace';
    ctx.font=`${weight} ${fs}px ${family}`;

    const m=ctx.measureText(el.textContent||'H');
    const actualA=m.actualBoundingBoxAscent||fs*.72;
    const actualD=m.actualBoundingBoxDescent||fs*.02;

    let baselineY;
    if(Number.isFinite(m.fontBoundingBoxAscent) && Number.isFinite(m.fontBoundingBoxDescent)){
      const fA=m.fontBoundingBoxAscent, fD=m.fontBoundingBoxDescent;
      baselineY=(lh-(fA+fD))/2+fA;
    }else{
      // Fallback close to CSS font metrics; only used in older browsers.
      baselineY=lh*.78;
    }

    const inkCenterY=baselineY+(actualD-actualA)/2;
    el.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
    parent.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
  });
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(setOpticalFlipAxes);
}else{
  requestAnimationFrame(setOpticalFlipAxes);
}
window.addEventListener('resize',setOpticalFlipAxes,{passive:true});

clock();setInterval(clock,15000);
