      position: fixed;

      width: clamp(52px, 4.2vw, 62px);
      height: clamp(32px, 2.85vw, 41px);
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .meter {
      border: 0;
      padding: 0;
      background: transparent;
      pointer-events: none;
      opacity: 1;
    }
    .meter-hit {
      border: 0;
      border-radius: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }
    .meter-hit.active { pointer-events: auto; }
    .meter-zone {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 50%;
      height: 80%;
      padding: 1px 0;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: clamp(4px, .35vw, 6px);
    }
    .meter-col {
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column-reverse;
      justify-content: space-between;
      align-items: stretch;
      gap: 0;
    }
    .meter-seg {
      position: relative;
      width: 100%;
      min-height: 0;
      flex: 0 0 1px;
      background: #343434;
      opacity: 1;
      border-radius: 0;
      transform: scaleY(1);
      transform-origin: center;
      transition: background 56ms linear, opacity 56ms linear, transform 72ms cubic-bezier(.2,.8,.2,1);
    }
    .meter::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 82%;
      height: 2px;
      background: #f1f1f1;
      transform: translate(-50%, -50%) rotate(-40deg) scaleX(0);
      transform-origin: center;
      transition: transform .18s ease;
    }
    .meter.paused::after { transform: translate(-50%, -50%) rotate(-40deg) scaleX(1); }
    .meter.paused .meter-seg { background: #343434 !important; opacity: 1 !important; transform: scaleY(1) !important; }

<script src="iso-meter-response.js?v=20261003-meter12"></script><script>
const field=document.querySelector('.photo-field');
const stories=[...document.querySelectorAll('.story')];
let resetTimer;
function activate(story){clearTimeout(resetTimer);field.dataset.active=story;stories.forEach(el=>el.classList.toggle('is-preview',el.dataset.story===story));}
function reset(){clearTimeout(resetTimer);resetTimer=setTimeout(()=>{if(!document.querySelector('.story:hover,.story:focus-visible')){field.removeAttribute('data-active');stories.forEach(el=>el.classList.remove('is-preview'));}},170)}
stories.forEach(el=>{
 el.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')activate(el.dataset.story)});
 el.addEventListener('pointerleave',reset);
 el.addEventListener('focus',()=>{if(el.matches(':focus-visible'))activate(el.dataset.story)});
 el.addEventListener('blur',reset);
 el.addEventListener('click',e=>{if(matchMedia('(hover:none)').matches&&e.detail>0&&!el.classList.contains('is-preview')){e.preventDefault();activate(el.dataset.story)}});
});
field.addEventListener('pointerenter',()=>clearTimeout(resetTimer));field.addEventListener('pointerleave',reset);
document.querySelectorAll('.photo').forEach(el=>el.addEventListener('pointerenter',()=>activate(el.dataset.story)));
const identities=[...document.querySelectorAll('.identity')];
identities.forEach(el=>{
  let inside=false;
  let flipped=false;
  el.addEventListener('pointerenter',()=>{
    if(inside) return;
    inside=true;
    flipped=!flipped;
    el.classList.toggle('identity-flipped',flipped);
  });
  el.addEventListener('pointerleave',()=>{
    inside=false;
  });
});

// ---------- optical flip axis ----------
// scaleY(-1) around the CSS line-box center can look like a vertical jump,
// because the font's real uppercase ink is not vertically centered inside
// that line box. Measure the actual glyph ink and rotate around its optical
// centre instead, so the visible top/bottom margins stay fixed in both states.
function setOpticalFlipAxes(){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const targets=[...document.querySelectorAll('.word-inner,.identity-inner,.char-flip')];

  targets.forEach(el=>{
    const parent=el.parentElement;
    const cs=getComputedStyle(parent);
    const fs=parseFloat(cs.fontSize)||16;
    const lhRaw=parseFloat(cs.lineHeight);
    const lh=Number.isFinite(lhRaw)?lhRaw:fs;
    const weight=cs.fontWeight||'400';
    const family=cs.fontFamily||'monospace';
    ctx.font=`${weight} ${fs}px ${family}`;

    const m=ctx.measureText(el.textContent||'H');
    const actualA=m.actualBoundingBoxAscent||fs*.72;
    const actualD=m.actualBoundingBoxDescent||fs*.02;

    let baselineY;
    if(Number.isFinite(m.fontBoundingBoxAscent) && Number.isFinite(m.fontBoundingBoxDescent)){
      const fA=m.fontBoundingBoxAscent, fD=m.fontBoundingBoxDescent;
      baselineY=(lh-(fA+fD))/2+fA;
    }else{
      // Fallback close to CSS font metrics; only used in older browsers.
      baselineY=lh*.78;
    }

    const inkCenterY=baselineY+(actualD-actualA)/2;
    el.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
    parent.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
  });
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(setOpticalFlipAxes);
}else{
  requestAnimationFrame(setOpticalFlipAxes);
}
window.addEventListener('resize',setOpticalFlipAxes,{passive:true});

// ---------- clock ----------
function clock(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',hour12:false}).format(n);document.getElementById('year').textContent=n.getFullYear()}
clock();setInterval(clock,15000);
