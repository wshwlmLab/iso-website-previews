</main></div><script src="iso-meter-response.js?v=20261003-meter12"></script><script>
const STORIES=[{"left": "sound-horeg/assets/foto_22.jpg", "right": "sound-horeg/assets/sound-horeg-woman-right-extended-v1.png", "card": "#ff351d", "text": "#090909", "title": "Una festa che deve tremare", "metaLeft": "Blog / Storia", "metaCenter": "01 / 02", "metaRight": "Giava Orientale", "contrast": 1.08, "rightPosition": "66% center"}, {"left": "gumleaf/assets/gumleaf-164.jpg", "right": "gumleaf/assets/gumleaf-portrait-expanded-v1.png", "card": "#72b94b", "text": "#090909", "title": "Gumleaf", "metaLeft": "Blog / Storia", "metaCenter": "02 / 02", "metaRight": "Australia", "contrast": 1.3, "rightPosition": "center top"}];
const DURATION=700;let current=0,locked=false,articleOpen=false,wheelAccumulator=0,wheelResetTimer=null,touchStartY=null;
const leftPane=document.querySelector('.pane-left'),rightPane=document.querySelector('.pane-right');
const leftBase=leftPane.querySelector('.base'),rightBase=rightPane.querySelector('.base');
const cardShell=document.querySelector('.card-shell'),cardBase=cardShell.querySelector('.base'),indexEl=document.querySelector('.index');
const frames=[...document.querySelectorAll('.story-frame')];
const url=p=>`url("${p}")`;
const frameReady=frames.map(f=>new Promise(resolve=>{f.addEventListener('load',resolve,{once:true})}));
function fillCard(el,s){el.style.background=s.card;el.style.color=s.text;el.querySelector('.card-title').textContent=s.title;const spans=el.querySelectorAll('.card-meta span');spans[0].textContent=s.metaLeft;spans[1].textContent=s.metaCenter;spans[2].textContent=s.metaRight}
function setBase(i){const s=STORIES[i];leftBase.style.backgroundImage=url(s.left);rightBase.style.backgroundImage=url(s.right);[leftBase,rightBase].forEach(el=>el.style.setProperty('--photo-contrast',s.contrast));rightBase.style.setProperty('--right-position',s.rightPosition);fillCard(cardBase,s);indexEl.textContent=`${String(i+1).padStart(2,'0')} / 02`;cardShell.setAttribute('aria-label',`Apri ${s.title}`)}
function makeImageLayer(pane,image,startY){const el=document.createElement('div');el.className='layer incoming';el.style.backgroundImage=url(image);el.style.transform=`translate3d(0,${startY}%,0)`;const next=STORIES[1-current];el.style.setProperty('--photo-contrast',next.contrast);el.style.setProperty('--right-position',next.rightPosition);pane.appendChild(el);return el}
function makeCard(s,startY){const el=document.createElement('div');el.className='card-face incoming';el.innerHTML='<div class="card-title"></div><div class="card-meta"><span></span><span></span><span></span></div>';fillCard(el,s);el.style.transform=`translate3d(0,${startY}%,0)`;cardShell.appendChild(el);return el}
 function twoStageProgress(t,midpointSpeed=.8,waveStrength=.4){
   // Keep only 40% of the double-wave modulation (5 -> 2) over a broad base
   // easing. The midpoint breath remains, but no longer breaks the main flow.
   const doubleWave=1-midpointSpeed/2;
   const fullWave=midpointSpeed/2;
   const waveProgress=t-doubleWave*Math.sin(4*Math.PI*t)/(4*Math.PI)-fullWave*Math.sin(2*Math.PI*t)/(2*Math.PI);
   const baseProgress=.5-.5*Math.cos(Math.PI*t);
   return baseProgress+(waveProgress-baseProgress)*waveStrength;
 }
 function pageTurnFrames(startY,arc=2.15,tilt=.62){
   // Two continuous acceleration waves share one gesture. Velocity drops almost
   // to zero at the midpoint, rises again, then eases into the final position.
   const samples=Array.from({length:129},(_,i)=>i/128);
   const lateralSign=-Math.sign(startY||1);
   const motionStrength=.4;
   return samples.map(t=>{
     const progress=twoStageProgress(t);
     const wave=Math.sin(Math.PI*progress);
     const x=lateralSign*arc*motionStrength*wave;
     const y=startY*(1-progress);
     const angle=lateralSign*tilt*motionStrength*wave;
     const scale=1+.009*motionStrength*wave;
     return {offset:t,transform:`translate3d(${x.toFixed(3)}%,${y.toFixed(3)}%,0) rotateZ(${angle.toFixed(3)}deg) scale3d(${scale.toFixed(4)},${scale.toFixed(4)},1)`};
   });
 }
 function go(direction){
   if(locked||articleOpen)return;
   const target=(current+direction+STORIES.length)%STORIES.length;
   locked=true;document.body.classList.add('has-moved');
   const next=STORIES[target];
   const leftIncoming=makeImageLayer(leftPane,next.left,direction>0?-100:100);
   const rightIncoming=makeImageLayer(rightPane,next.right,direction>0?100:-100);
   const cardIncoming=makeCard(next,direction>0?-100:100);
   // Remove CSS transitions from these temporary layers: WAAPI owns one compositor timeline.
   [leftIncoming,rightIncoming,cardIncoming].forEach(el=>el.style.transition='none');
   const startL=direction>0?-100:100;
   const startR=-startL;
   const opts={duration:DURATION,easing:'linear',fill:'forwards'};
   const a1=leftIncoming.animate(pageTurnFrames(startL),opts);
   const a2=rightIncoming.animate(pageTurnFrames(startR),opts);
   const a3=cardIncoming.animate(pageTurnFrames(startL,.48,.16),opts);
   Promise.all([a1.finished,a2.finished,a3.finished]).then(()=>{
     current=target;setBase(current);
     leftIncoming.remove();rightIncoming.remove();cardIncoming.remove();
     locked=false;wheelAccumulator=0;
   });
 }

async function openArticle(){
 if(locked||articleOpen)return;locked=true;
 const frame=frames[current];await frameReady[current];
 try{await Promise.allSettled([...frame.contentDocument.querySelectorAll('.entry-inset img,.entry-right')].map(im=>im.decode?.()))}catch(_){}
 articleOpen=true;frame.classList.add('active');frame.setAttribute('aria-hidden','false');
 document.body.classList.add('article-active');
 frame.contentWindow.postMessage({type:'iso-blog-open'},location.origin);
 frame.contentWindow.focus();locked=false;
}
function closeArticle(){
 if(!articleOpen)return;
 const frame=frames[current];frame.contentWindow.postMessage({type:'iso-blog-close'},location.origin);
 frame.classList.remove('active');frame.setAttribute('aria-hidden','true');articleOpen=false;locked=false;
 document.body.classList.remove('article-active');wheelAccumulator=0;touchStartY=null;cardShell.focus({preventScroll:true});
}

function onWheel(e){if(articleOpen)return;e.preventDefault();if(locked)return;wheelAccumulator+=e.deltaY;clearTimeout(wheelResetTimer);wheelResetTimer=setTimeout(()=>wheelAccumulator=0,120);if(Math.abs(wheelAccumulator)>=18){const dir=wheelAccumulator>0?1:-1;wheelAccumulator=0;go(dir)}}
function onKey(e){if(articleOpen){if(e.key==='Escape')closeArticle();return}if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(-1)}else if(e.key==='Enter'){e.preventDefault();openArticle()}}
function onTouchStart(e){if(articleOpen)return;touchStartY=e.touches?.[0]?.clientY??null}

cardShell.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();openArticle()}});
setBase(0);addEventListener('wheel',onWheel,{passive:false});addEventListener('keydown',onKey);addEventListener('touchstart',onTouchStart,{passive:true});addEventListener('touchend',onTouchEnd,{passive:true});
// Decode both covers before the first gesture: no image-loading gaps in the turn.
Promise.allSettled(STORIES.flatMap(s=>[s.left,s.right]).map(src=>{const im=new Image();im.src=src;return im.decode?.()}));
const identities=[...document.querySelectorAll('.identity')];
identities.forEach(el=>{
  let inside=false;
  let flipped=false;
  el.addEventListener('pointerenter',()=>{
    if(inside) return;
    inside=true;
    flipped=!flipped;
    el.classList.toggle('identity-flipped',flipped);
  });
  el.addEventListener('pointerleave',()=>{
    inside=false;
  });
});

// ---------- optical flip axis ----------
// scaleY(-1) around the CSS line-box center can look like a vertical jump,
// because the font's real uppercase ink is not vertically centered inside
// that line box. Measure the actual glyph ink and rotate around its optical
// centre instead, so the visible top/bottom margins stay fixed in both states.
function setOpticalFlipAxes(){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  const targets=[...document.querySelectorAll('.word-inner,.identity-inner,.char-flip')];

  targets.forEach(el=>{
    const parent=el.parentElement;
    const cs=getComputedStyle(parent);
    const fs=parseFloat(cs.fontSize)||16;
    const lhRaw=parseFloat(cs.lineHeight);
    const lh=Number.isFinite(lhRaw)?lhRaw:fs;
    const weight=cs.fontWeight||'400';
    const family=cs.fontFamily||'monospace';
    ctx.font=`${weight} ${fs}px ${family}`;

    const m=ctx.measureText(el.textContent||'H');
    const actualA=m.actualBoundingBoxAscent||fs*.72;
    const actualD=m.actualBoundingBoxDescent||fs*.02;

    let baselineY;
    if(Number.isFinite(m.fontBoundingBoxAscent) && Number.isFinite(m.fontBoundingBoxDescent)){
      const fA=m.fontBoundingBoxAscent, fD=m.fontBoundingBoxDescent;
      baselineY=(lh-(fA+fD))/2+fA;
    }else{
      // Fallback close to CSS font metrics; only used in older browsers.
      baselineY=lh*.78;
    }

    const inkCenterY=baselineY+(actualD-actualA)/2;
    el.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
    parent.style.setProperty('--optical-axis-y',`${inkCenterY.toFixed(3)}px`);
  });
}

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(setOpticalFlipAxes);
}else{
  requestAnimationFrame(setOpticalFlipAxes);
}
window.addEventListener('resize',setOpticalFlipAxes,{passive:true});

function clock(){const n=new Date();document.getElementById('clock').textContent=new Intl.DateTimeFormat('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit',hour12:false}).format(n);document.getElementById('year').textContent=n.getFullYear()}
clock();setInterval(clock,15000);
