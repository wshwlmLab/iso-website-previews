<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Il Suono Organizzato — HOME 1 plus candidate</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#efeeeb}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#efeeeb}
  </style>
</head>
<body>
  <iframe id="home1" title="HOME 1 approved plus candidate"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('home1');
      const frozenPath = '/Il-Suono-Organizzato-HOME-1-TRUCK-FROZEN-2026-09-15.html';
      const sourcePrefix = 'https://iso-home-truck-meter-01.willy-washburn.chatgpt.site/assets/';

      fetch(frozenPath, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error(`Frozen HOME 1 unavailable: ${response.status}`);
          return response.text();
        })
        .then(html => {
          html = html.replaceAll(sourcePrefix, '/api/home1-asset?name=');

          const delta = `
            <style id="candidate-home1-plus-home2-size">
              .plus { width: clamp(128px, 10.4vw, 176px) !important; }
              .plus::before, .plus::after { height: 5px !important; }
              @media (max-width: 700px) {
                .plus { width: 136px !important; }
              }
            </style>`;

          html = html.replace('</head>', `${delta}</head>`);
          frame.srcdoc = html;
        })
        .catch(error => {
          document.body.textContent = error.message;
        });
    })();
  </script>
</body>
</html>
