<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Il Suono Organizzato — HOME 1 plus size candidate</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#efeeeb}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#efeeeb}
  </style>
</head>
<body>
  <iframe id="home1" src="../../../Il-Suono-Organizzato-HOME-1-TRUCK-FROZEN-2026-09-15.html" title="HOME 1 Truck candidate"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('home1');
      frame.addEventListener('load', () => {
        const doc = frame.contentDocument;
        if (!doc) return;
        const style = doc.createElement('style');
        style.textContent = `
          .plus {
            width: clamp(128px, 10.4vw, 176px) !important;
          }
          .plus::before, .plus::after {
            height: 5px !important;
          }
          @media (max-width: 700px) {
            .plus { width: 136px !important; }
          }
        `;
        doc.head.appendChild(style);
      });
    })();
  </script>
</body>
</html>
